spring:
  profiles:
    include: ""

logging:
  level:
    root: WARN

lsc:
  cors:
    allowed-origins: https://*.lianshengtong.com,https://*.chainshangtong.com

knife4j:
  enable: false

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true