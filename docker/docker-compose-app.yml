version: '3.8'

services:
  lsc-gateway:
    image: lsc/lsc-gateway:6.2.0
    container_name: lsc-gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SERVER_PORT=8000
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      nacos:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - lsc-net

  lsc-user-service:
    image: lsc/lsc-user-service:6.2.0
    container_name: lsc-user-service
    restart: always
    ports:
      - "8101:8101"
    environment:
      - SERVER_PORT=8101
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8101/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - lsc-net

  lsc-ledger-service:
