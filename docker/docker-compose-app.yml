    ports:
      - "8102:8102"
    environment:
      - SERVER_PORT=8102
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    depends_on:
      nacos:
