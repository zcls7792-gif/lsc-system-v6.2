# ============================================================
# Alertmanager 配置
# 告警路由与通知渠道
# ============================================================
global:
  # SMTP 配置 (邮件告警，按需启用)
  # smtp_smarthost: 'smtp.lianshengtong.com:465'
  # smtp_from: 'alert@lianshengtong.com'
  # smtp_auth_username: 'alert@lianshengtong.com'
  # smtp_auth_password: '${SMTP_PASSWORD}'
  resolve_timeout: 5m

# 告警分组与去重
route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # 严重告警立即发送
    - matchers:
        - severity = "critical"
      receiver: 'critical'
      group_wait: 10s
      repeat_interval: 1h
    # 警告级别
    - matchers:
        - severity = "warning"
      receiver: 'warning'
      repeat_interval: 4h

receivers:
  - name: 'default'
    # 默认接收器：仅记录日志
    webhook_configs:
      - url: 'http://localhost:5001/alerts'
        send_resolved: true

  - name: 'critical'
    # 严重告警：邮件 + Webhook
    # email_configs:
    #   - to: 'ops@lianshengtong.com'
    #     headers:
    #       Subject: '【LSC严重告警】{{ .GroupLabels.alertname }}'
    webhook_configs:
      - url: 'http://localhost:5001/alerts/critical'
        send_resolved: true

  - name: 'warning'
    # 警告级别：Webhook
    webhook_configs:
      - url: 'http://localhost:5001/alerts/warning'
        send_resolved: true

# 告警抑制规则
inhibit_rules:
  # 当服务下线时，抑制该服务的其他告警
  - source_matchers:
      - alertname = "服务不可用"
    target_matchers:
      - severity = "warning"
    equal: ['job']
