# Seata registry.conf - 注册中心配置
# 使用Nacos作为注册中心和配置中心

service {
    vgroupMapping.lsc-ledger-service-group = "default"
    vgroupMapping.lsc-b2b-service-group = "default"
    vgroupMapping.lsc-order-service-group = "default"
    vgroupMapping.lsc-writeoff-service-group = "default"
    vgroupMapping.lsc-release-service-group = "default"
    vgroupMapping.lsc-promotion-service-group = "default"
    default.grouplist = "seata-server:8091"
    enableDegrade = false
    disableGlobalTransaction = false
}

registry {
    type = "nacos"
    nacos {
        application = "seata-server"
        serverAddr = "nacos:8848"
        group = "SEATA_GROUP"
        namespace = ""
        username = "lsc_nacos"
        password = "Lsc@Nacos2026"
    }
}

config {
    type = "file"
    file {
        name = "file:/root/seata-config/file.conf"
    }
}
