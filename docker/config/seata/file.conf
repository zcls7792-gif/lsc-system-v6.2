# Seata file.conf - 存储模式配置
# 使用MySQL存储事务日志

store {
    mode = "db"
    publicKey = ""

    db {
        datasource = "druid"
        dbType = "mysql"
        driverClassName = "com.mysql.cj.jdbc.Driver"
        url = "jdbc:mysql://mysql:3306/seata?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
        user = "root"
        password = "Lsc@2026#Secure"
        minConn = 10
        maxConn = 100
        globalTable = "global_table"
        branchTable = "branch_table"
        lockTable = "lock_table"
        distributedLockTable = "distributed_lock"
        queryLimit = 1000
        maxWait = 5000
    }

    redis {
        mode = "cluster"
        password = "Lsc@Redis2026"
        database = 0
        minConn = 10
        maxConn = 100
        maxTotal = 100
        clusterNodes = "redis-node-1:7000,redis-node-2:7001,redis-node-3:7002,redis-node-4:7003,redis-node-5:7004,redis-node-6:7005"
    }
}

service {
    vgroupMapping.lsc-ledger-service-group = "default"
    vgroupMapping.lsc-b2b-service-group = "default"
    vgroupMapping.lsc-order-service-group = "default"
    vgroupMapping.lsc-writeoff-service-group = "default"
    vgroupMapping.lsc-release-service-group = "default"
    vgroupMapping.lsc-promotion-service-group = "default"
    default.grouplist = "seata-server:8091"
    enableDegrade = false
    disableGlobalTransaction = false
}

client {
    rm {
        asyncCommitBufferLimit = 10000
        lock {
            retryInterval = 10
            retryTimes = 30
            retryPolicyBranchRollbackOnConflict = true
        }
        reportRetryCount = 5
        tableMetaCheckEnable = true
        tableMetaCheckerInterval = 60000
        afterImageCommitLimit = 1
    }
    tm {
        commitRetryCount = 5
        rollbackRetryCount = 5
        defaultGlobalTransactionTimeout = 60000
        degradeCheck = false
        degradeCheckAllowTimes = 10
        degradeCheckPeriod = 2000
    }
    undo {
        dataValidation = true
        onlyCareUpdateColumns = true
        logSerialization = "jackson"
        logTable = "undo_log"
    }
    loadBalance {
        type = "RandomLoadBalance"
        virtualNodes = 10
    }
}
