upstream lsc_gateway {
    server lsc-gateway:8000;
}

server {
    listen 80;
    server_name api.lianshengtong.com;

    # 全局限流
    limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # 请求大小限制
    client_max_body_size 100m;

    # 超时
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    # 转发到 Spring Cloud Gateway
    location / {
        limit_req zone=api burst=400 nodelay;
        limit_conn zone=conn burst=100;
        
        proxy_pass http://lsc_gateway;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # 响应头透传
        proxy_pass_header Server;
        proxy_pass_header X-Request-Id;
        
        # CORS
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id" always;
        add_header Access-Control-Allow-Credentials true always;
    }

    # 健康检查
    location /health {
        proxy_pass http://lsc_gateway/actuator/health;
    }

    # Prometheus指标
    location /metrics {
        proxy_pass http://lsc_gateway/actuator/prometheus;
        allow 127.0.0.1;
        deny all;
    }
}