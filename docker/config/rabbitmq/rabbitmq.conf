# RabbitMQ配置

# 消息持久化
default_vhost = /
default_user = lsc_admin
default_pass = Lsc@MQ2026

# 消息确认模式
default_prefetch = 10

# 镜像队列(高可用)
ha_mode = all
ha_sync_mode = automatic

# 持久化配置
disk_free_limit = 2GB
vm_memory_high_watermark = 0.4

# 开启生产者confirm
collect_statistics = true

# 日志
log.level = info
log.file = true

# 管理插件
management.tcp.ip = 0.0.0.0
management.tcp.port = 15672
