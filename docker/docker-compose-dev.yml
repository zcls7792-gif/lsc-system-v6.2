version: '3.8'

# ============================================================
# 链盛通LSC系统 V6.2 — 本地开发版配置
# 仅包含8个核心微服务: gateway, user, ledger, b2b, order, writeoff, evidence, ai-gateway
# 依赖: 基础环境层 (docker-compose.yml) 中的 nacos, mysql, redis-cluster-init
# ============================================================

services:

  # ---- API 网关 ----
  lsc-gateway:
    image: lsc/lsc-gateway:6.2.0
    build:
      context: ../lsc-gateway
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: lsc-gateway.jar
        SERVICE_NAME: lsc-gateway
    container_name: lsc-gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom
      - SERVER_PORT=8000
      - TZ=Asia/Shanghai
    depends_on:
      - nacos
      - mysql
      - redis-cluster-init
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    networks:
      - lsc-net

  # ---- 用户服务 ----
  lsc-user-service:
    image: lsc/lsc-user-service:6.2.0
    build:
      context: ../lsc-user-service
      dockerfile: ../docker/Dockerfile
      args:
        JAR_FILE: lsc-user-service.jar
        SERVICE_NAME: lsc-user-service
    container_name: lsc-user-service
    restart: always
    ports:
