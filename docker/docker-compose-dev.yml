      - JAVA_OPTS=-Xms512m -Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom
      - SERVER_PORT=8102
      - TZ=Asia/Shanghai
    depends_on:
      - nacos
      - mysql
      - redis-cluster-init
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8102/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - lsc-net

  # ---- B2B服务 ----
  lsc-b2b-service:
