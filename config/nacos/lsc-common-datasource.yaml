# ============================================================
# Nacos共享配置 - 公共数据源配置(分库分表)
# Data ID: lsc-common-datasource.yaml
# Group: LSC_GROUP
# ============================================================
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      # 8库分片 - ShardingSphere接管实际路由
      url: jdbc:mysql://mysql:3306/lsc_db_0,lsc_db_1,lsc_db_2,lsc_db_3,lsc_db_4,lsc_db_5,lsc_db_6,lsc_db_7?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowMultiQueries=true
      username: root
      password: Lsc@2026#Secure
      initial-size: 10
      min-idle: 10
      max-active: 200
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=1000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        allow:
        deny:
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
        wall:
          enabled: true

# ShardingSphere分库分表配置
shardingsphere:
  mode:
    type: Cluster
    repository:
      type: JDBC
  # 数据源(8个物理库)
  datasource:
    names: ds0,ds1,ds2,ds3,ds4,ds5,ds6,ds7
    ds0:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://mysql:3306/lsc_db_0?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      username: root
      password: Lsc@2026#Secure
    ds1:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://mysql:3306/lsc_db_1?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      username: root
      password: Lsc@2026#Secure
    ds2:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://mysql:3306/lsc_db_2?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      username: root
      password: Lsc@2026#Secure
    ds3:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://mysql:3306/lsc_db_3?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      username: root
      password: Lsc@2026#Secure
    ds4:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://mysql:3306/lsc_db_4?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      username: root
      password: Lsc@2026#Secure
    ds5:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://mysql:3306/lsc_db_5?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      username: root
      password: Lsc@2026#Secure
    ds6:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://mysql:3306/lsc_db_6?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      username: root
      password: Lsc@2026#Secure
    ds7:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://mysql:3306/lsc_db_7?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      username: root
      password: Lsc@2026#Secure
  # 分库分表规则
  rules:
    sharding:
      # 广播表(全局表，每个库都存在)
      broadcast-tables: merchant_extensions,merchant_nh_records,b2b_orders,products,daily_release_summary,release_config,merchant_violations,risk_logs,blockchain_records,daily_snapshot_records,admin_audit_logs,tx_exception_log,admins,product_categories,promotion_pending,evidence_failover,param_change_approval
      # 分库规则: 按user_id取模8定位物理库
      default-database-strategy:
        standard:
          sharding-column: user_id
          sharding-algorithm-name: db-mod
      tables:
        # users表: 8库×4表=32分片
        users:
          actual-data-nodes: ds$->{0..7}.users_$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              sharding-algorithm-name: db-mod
          table-strategy:
            standard:
              sharding-column: user_id
              sharding-algorithm-name: tbl-mod
        # lsc_accounts表
        lsc_accounts:
          actual-data-nodes: ds$->{0..7}.lsc_accounts_$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              sharding-algorithm-name: db-mod
          table-strategy:
            standard:
              sharding-column: user_id
              sharding-algorithm-name: tbl-mod
        # lsc_transactions表
        lsc_transactions:
          actual-data-nodes: ds$->{0..7}.lsc_transactions_$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              sharding-algorithm-name: db-mod
          table-strategy:
            standard:
              sharding-column: user_id
              sharding-algorithm-name: tbl-mod
        # available_lsc_details表
        available_lsc_details:
          actual-data-nodes: ds$->{0..7}.available_lsc_details_$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              sharding-algorithm-name: db-mod
          table-strategy:
            standard:
              sharding-column: user_id
              sharding-algorithm-name: tbl-mod
        # orders表
        orders:
          actual-data-nodes: ds$->{0..7}.orders_$->{0..3}
          database-strategy:
            standard:
              sharding-column: consumer_id
              sharding-algorithm-name: db-mod
          table-strategy:
            standard:
              sharding-column: consumer_id
              sharding-algorithm-name: tbl-mod
      sharding-algorithms:
        db-mod:
          type: MOD
          props:
            sharding-count: 8
        tbl-mod:
          type: MOD
          props:
            sharding-count: 4
      key-generators:
        snowflake:
          type: SNOWFLAKE
          props:
            worker-id: 1
    # 读写分离
    readwrite-splitting:
      data-sources:
        ds-readwrite:
          static-strategy:
            write-data-source-name: ds0
            read-data-source-names: ds1,ds2,ds3
