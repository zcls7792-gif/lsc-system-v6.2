server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: lsc-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.MetricsAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.export.simple.SimpleMetricsExportAutoConfiguration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:lsc}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:lsc}
    password: ${MYSQL_PASSWORD:lsc@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  jpa:
    hibernate:
      ddl-auto: none

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  secret: ${JWT_SECRET:lsc-platform-secret-key-2026-must-be-at-least-256-bits-long-for-hs256}
  expiration: 604800000

# LSC 业务参数（硬约束）
lsc:
  release:
    rate-max: 0.0006
    rate-min: 0.0003
    k-min: 0.005
    k-max: 0.010
    alpha: 0.06
  nh:
    ratio: 0.87
    daily-once: true
  split:
    merchant-main: 0.84
    merchant-regulatory: 0.14
    platform-fee: 0.02

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.lianshengtong: info
    root: warn
  file:
    name: /var/log/lsc/lsc-backend.log
