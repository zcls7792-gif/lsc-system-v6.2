version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lsc-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root@2026
      MYSQL_DATABASE: lsc
      MYSQL_USER: lsc
      MYSQL_PASSWORD: lsc@2026
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot@2026"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./lsc-backend
      dockerfile: Dockerfile
    container_name: lsc-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: lsc
      MYSQL_USER: lsc
      MYSQL_PASSWORD: lsc@2026
      JWT_SECRET: lsc-platform-production-secret-key-2026-must-be-at-least-256-bits
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/var/log/lsc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8

  nginx:
    image: nginx:1.25-alpine
    container_name: lsc-nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/v6.2.0-gray-approval:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
