server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: lsc-system
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.JvmMetricsAutoConfiguration
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lsc_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ""
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 50
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# V7.7.2 释放参数（可后台配置，双签审批）
lsc:
  release:
    w-min-ppm: 10000
    w-max-ppm: 20000
    r-min-ppb: 500000
    r-max-ppb: 1000000
  coupon:
    expired-refund-grace-days: 7

knife4j:
  enable: true
  setting:
    language: zh_cn

management:
  metrics:
    enable:
      processor: false
      uptime: false
      jvm: false
      system: false

logging:
  level:
    com.lianshengtong: INFO
