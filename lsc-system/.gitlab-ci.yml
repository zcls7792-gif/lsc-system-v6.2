# ====================================================================
# 链盛通 LSC V6.2-AI · GitLab CI 片段
# --------------------------------------------------------------------
# 覆盖场景:
#   1) test:chart-coverage — 对 P0 图表逻辑跑 4 步全流程
#        基线 verify_p0(22) + TAP BUG 回归(8) + c8(42断言) + HTML 总览报告
#        产物: coverage/ (逐行 html + lcov.info)、覆盖率总览 HTML、每步独立 logs
#        指标: 用 c8 text-summary 的 Statements 百分比注入 MR badge
#
#   2) pages                  — (可选) 把 coverage/index.html + 总览报告部署到 GitLab Pages
#                               仅在 master/main / tag 触发,依赖 test:chart-coverage 产物
#
# 关键变量约定:
#   - $CI_COMMIT_SHORT_SHA  GitLab 内置,用于把每次运行的覆盖率/日志聚合到独立子目录,
#                          符合"同一次执行一个目录"原则,避免跨 pipeline 混数据
#   - $LSC_COVERAGE_MIN_STMT   (可选,在 CI/CD Variables 里设置)语句覆盖率下限(%)
#   - $LSC_COVERAGE_MIN_BRANCH (可选)分支覆盖率下限(%)
#
# 项目内脚本入口(已对齐 package.json):
#   npm run ci        → node run-all.js  (4 步全流程,带 ASCI 汇总表)
#   npm run report    → 生成 覆盖率报告_P0-图表逻辑_日期.html
# ====================================================================

stages:
  - test
  - pages

# ---- 公共变量 -----------------------------------------------------------
variables:
  NODE_VERSION: "22-alpine"              # 也可用 20-alpine / 18-alpine
  # 给 c8 / run-all.js 用:同一次 pipeline 统一一个报告目录
  LSC_REPORT_SUBDIR: "$CI_COMMIT_SHORT_SHA"
  FF_SCRIPT_SECTIONS: "true"             # GitLab 折叠 section,日志更清爽
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

# ---- 公共模板 -----------------------------------------------------------
.node_setup:
  image: "node:${NODE_VERSION}"
  cache: &npm_cache
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
    policy: pull
  before_script:
    - echo "==> Setup env"
    - node -v && npm -v
    - npm config set cache "$CI_PROJECT_DIR/.npm" --global
    - |
      if [ -f package-lock.json ]; then
        echo "==> npm ci (frozen lockfile)"
        npm ci --prefer-offline --no-audit --no-fund
      else
        echo "==> 项目缺少 package-lock.json,回退到 npm install(不稳定,建议提交 lockfile)"
        npm install --no-audit --no-fund
      fi
    # 子目录: 保证每次 pipeline 的覆盖率/日志隔离
    - mkdir -p "coverage/$LSC_REPORT_SUBDIR" logs
    - echo "Commit $CI_COMMIT_SHA ($CI_COMMIT_SHORT_SHA) @ $(date -u +%FT%TZ)" > logs/CI_BUILD_INFO.txt

# ====================================================================
# Job 1 : 图表逻辑回归 + 覆盖率 + 总览报告
# ====================================================================
test:chart-coverage:
  extends: [.node_setup]
  stage: test
  timeout: 20m                            # 经验 949301: 给长任务留足边界 + 日志独立落盘
  interruptible: true
  cache:
    # 首次跑(或 lock 变更时)允许回写 cache,后续 runs 只 pull
    <<: *npm_cache
    policy: pull-push
  variables:
    # 让 run-all 把每步 stdout/stderr 也 tee 到 logs/,便于任务卡住时直接下载分析
    # (run-all 内部会判断 $GITLAB_CI=='true' 时启用 tee)
    GITLAB_CI: "true"
  script:
    - echo "==> STEP 1~4 全流程 (npm run ci == run-all.js)"
    - |
      # run-all 自身是 4 个子进程串行;这里同时重定向到 logs/ 以便下载排查
      # 经验 949301: "以日志为准"收敛 — 即使 section 被折叠/任务超时,也能拿 logs 判断卡在第几步
      set -o pipefail
      npm run ci 2>&1 | tee logs/pipeline-run-all.log
      rc=${PIPESTATUS[0]}
      echo "==> run-all 退出码: $rc"
      exit $rc

    # ---- 覆盖率阈值门控(可选) ------------------------------------------
    - |
      echo "==> 覆盖率阈值检查 (如设置了 LSC_COVERAGE_MIN_*)"
      LCOV="coverage/$LSC_REPORT_SUBDIR/lcov.info"
      if [ ! -f "$LCOV" ]; then
        # c8 默认会写 coverage/lcov.info;尝试复制到按提交分的目录
        if [ -f coverage/lcov.info ]; then
          cp -a coverage/lcov.info coverage/lcov-report coverage/html-report 2>/dev/null || true
          mv coverage/lcov.info    "coverage/$LSC_REPORT_SUBDIR/" 2>/dev/null || true
        fi
      fi
      # 汇总一行:从 coverage-summary.json 读更准,拿不到就从 c8 文本 Summary 行 grep
      if [ -f coverage/coverage-summary.json ]; then
        cp coverage/coverage-summary.json "coverage/$LSC_REPORT_SUBDIR/summary.json" 2>/dev/null || true
      fi
      # 计算 4 个百分比
      if [ -f "coverage/$LSC_REPORT_SUBDIR/lcov.info" ]; then
        node -e "
          const fs=require('fs'),p='coverage/'+process.env.LSC_REPORT_SUBDIR+'/lcov.info';
          const s=fs.readFileSync(p,'utf8');let lf=0,lh=0,bf=0,bh=0,ff=0,fh=0;
          for(const l of s.split(/\r?\n/)){
            if(l.startsWith('LF:'))lf+=+l.slice(3);if(l.startsWith('LH:'))lh+=+l.slice(3);
            if(l.startsWith('BRF:'))bf+=+l.slice(4);if(l.startsWith('BRH:'))bh+=+l.slice(4);
            if(l.startsWith('FNF:'))ff+=+l.slice(4);if(l.startsWith('FNH:'))fh+=+l.slice(4);
          }
          const pct=(h,f)=>f?(100*h/f):100;
          const r={stmts:pct(lh,lf).toFixed(2),branch:pct(bh,bf).toFixed(2),funcs:pct(fh,ff).toFixed(2),lines:pct(lh,lf).toFixed(2)};
          fs.writeFileSync('coverage/'+process.env.LSC_REPORT_SUBDIR+'/metrics.json', JSON.stringify(r,null,2));
          console.log(JSON.stringify(r));
          let fail=[];
          const mStmt=+process.env.LSC_COVERAGE_MIN_STMT, mBr=+process.env.LSC_COVERAGE_MIN_BRANCH;
          if(mStmt && +r.stmts  < mStmt) fail.push('stmts '+r.stmts+'% < '+mStmt+'%');
          if(mBr   && +r.branch < mBr)   fail.push('branch '+r.branch+'% < '+mBr+'%');
          if(fail.length){ console.error('COVER THRESHOLD FAIL:',fail.join('; ')); process.exit(2); }
        "
      fi

    # ---- 把产物移到本次提交子目录(便于归档比对) --------------------------
    - |
      echo "==> 归档本次报告: coverage/$LSC_REPORT_SUBDIR/ 与 logs/"
      # 拷贝 c8 html 报告到 独立子目录/html
      if [ -d coverage/html-report ]; then mv coverage/html-report "coverage/$LSC_REPORT_SUBDIR/html"; fi
      if [ -d coverage/lcov-report ]; then mv coverage/lcov-report "coverage/$LSC_REPORT_SUBDIR/lcov-html"; fi
      # 覆盖率总览 HTML (类似 覆盖率报告_P0-图表逻辑_20260827.html)
      mv -f 覆盖率报告_P0-图表逻辑_*.html "coverage/$LSC_REPORT_SUBDIR/总览报告.html" 2>/dev/null || true
  coverage: '/Statements\s*:\s*([\d.]+%)/'              # GitLab MR badge = c8 Statements %
  artifacts:
    name: "lsc-coverage-$CI_COMMIT_SHORT_SHA"
    when: always                                        # 即便失败也能拿 logs / 覆盖率半产物判断卡点
    expire_in: 30 days
    paths:
      - coverage/                                       # 逐行 HTML / lcov / 总览报告
      - logs/                                           # 每步独立日志: 超时/skipped 时能直接离线分析
    reports:
      # GitLab 16.0+ 支持 coverage_report(cobertura.xml);我们出的是 lcov,
      # 如后续想在 MR diff 里看逐行覆盖率,可加 lcov → cobertura 转换步骤再接上
      # coverage_report:
      #   coverage_format: cobertura
      #   path: coverage/cobertura.xml

# ====================================================================
# Job 2 : Pages (可选,只在 master/tag 生成一次公开报告)
# ====================================================================
pages:
  stage: pages
  image: alpine:latest
  needs:
    - job: test:chart-coverage
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "==> Assemble GitLab Pages public/"
    - mkdir -p public
    # 最新一份(按 commit SHA) 总览报告放首页
    - |
      latest=$(find coverage -maxdepth 1 -mindepth 1 -type d | sort | tail -n1)
      echo "Using latest report dir: $latest"
      if [ -d "$latest/html" ];      then cp -a "$latest/html"          public/html-c8; fi
      if [ -d "$latest/lcov-html" ]; then cp -a "$latest/lcov-html"    public/lcov; fi
      if [ -f "$latest/总览报告.html" ]; then cp -a "$latest/总览报告.html" public/index.html; fi
      # 兜底:如果没有按 SHA 归档成功,用根目录 coverage/index.html
      if [ ! -f public/index.html ] && [ -f coverage/index.html ]; then
        cp -a coverage public/coverage
        printf '<meta http-equiv="refresh" content="0; url=coverage/index.html" />\n' > public/index.html
      fi
    - ls -la public/ || true
  artifacts:
    name: "pages-$CI_COMMIT_SHORT_SHA"
    paths:
      - public
