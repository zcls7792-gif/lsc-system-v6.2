# ====================================================================
# 链盛通 LSC V6.2-AI · GitLab CI · 全质量门控流水线
# --------------------------------------------------------------------
# Stage 顺序:
#   1) build-ci     · P0 图表逻辑 + 回归 4 步全流程 + c8 覆盖率 + ASCI 汇总表
#   2) quality      · (新增) 三重硬门控,任一失败 阻塞 MR
#                     · coverage_gate    : c8 硬阈值 Stmt≥99% / Branch≥95% / Func≥95%
#                     · assets_meta_gate : 体量阈值 + SEO/OG/Twitter/schema 合规
#   3) a11y         · 16 快照 light/dark axe-core 严格 0 违规 + baseline diff
#   4) pages        · (可选) GitLab Pages 部署: 覆盖率 HTML + A11y 报告首页
#
# 项目内脚本入口(已对齐 package.json):
#   npm run coverage           → c8 门控 (内置 checkCoverage)
#   npm run audit:assets:ci    → 资产体量严格审计
#   npm run audit:meta:ci      → 元数据合规严格审计
#   npm run audit:a11y         → Playwright 16 快照 axe-core
# ====================================================================

stages:
  - build-ci
  - quality
  - a11y
  - pages

# ---- 公共变量 -----------------------------------------------------------
variables:
  NODE_VERSION: "22-alpine"
  LSC_REPORT_SUBDIR: "$CI_COMMIT_SHORT_SHA"
  FF_SCRIPT_SECTIONS: "true"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  # 覆盖率硬阈值 (不依赖 CI 变量注入,直接写死保障 MR 安全)
  LSC_MIN_STMT:   "99"
  LSC_MIN_BRANCH: "95"
  LSC_MIN_FUNC:   "95"

# ---- 公共模板 -----------------------------------------------------------
.node_setup:
  image: "node:${NODE_VERSION}"
  cache: &npm_cache
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
    policy: pull
  before_script:
    - echo "==> Setup env"
    - node -v && npm -v
    - npm config set cache "$CI_PROJECT_DIR/.npm" --global
    - |
      if [ -f package-lock.json ]; then
        echo "==> npm ci (frozen lockfile)"
        npm ci --prefer-offline --no-audit --no-fund
      else
        echo "==> 项目缺少 package-lock.json,回退到 npm install(不稳定,建议提交 lockfile)"
        npm install --no-audit --no-fund
      fi
    - mkdir -p "coverage/$LSC_REPORT_SUBDIR" logs audit-report
    - echo "Commit $CI_COMMIT_SHA ($CI_COMMIT_SHORT_SHA) @ $(date -u +%FT%TZ)" > logs/CI_BUILD_INFO.txt

# ====================================================================
# Stage 1 : 图表逻辑回归 + 覆盖率 + 总览报告 (原 test:chart-coverage)
# ====================================================================
build-ci:chart-coverage:
  extends: [.node_setup]
  stage: build-ci
  timeout: 20m
  interruptible: true
  cache:
    <<: *npm_cache
    policy: pull-push
  variables:
    GITLAB_CI: "true"
  script:
    - echo "==> STEP 1~5 全流程 (npm run ci == run-all.js)"
    - |
      const { spawnSync } = require('child_process');
      const fs = require('fs');
      const LOG = 'logs/pipeline-run-all.log';
      const p = spawnSync('npm', ['run', 'ci'], {
        cwd: process.cwd(), encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], maxBuffer: 80*1024*1024, env: process.env, shell: true
      });
      if (p.stdout) process.stdout.write(p.stdout);
      if (p.stderr) process.stderr.write(p.stderr);
      try { fs.writeFileSync(LOG, '# npm run ci\n' + (p.stdout||'') + (p.stderr?'\n---STDERR---\n'+p.stderr:'')); } catch(_){}
      console.log('==> run-all 退出码:', p.status);
      process.exit(p.status || 0);

    # ---- 覆盖率阈值门控(硬阈值,不依赖可选变量) ------------------------
    - |
      echo "==> 覆盖率硬阈值检查: Stmt≥${LSC_MIN_STMT}% Branch≥${LSC_MIN_BRANCH}% Func≥${LSC_MIN_FUNC}%"
      mkdir -p "coverage/$LSC_REPORT_SUBDIR"
      [ -f coverage/cobertura.xml ]        && cp -a coverage/cobertura.xml "coverage/$LSC_REPORT_SUBDIR/cobertura.xml" || true
      [ -f coverage/lcov.info ]            && cp -a coverage/lcov.info    "coverage/$LSC_REPORT_SUBDIR/lcov.info"    || true
      [ -f coverage/coverage-summary.json ]&& cp -a coverage/coverage-summary.json "coverage/$LSC_REPORT_SUBDIR/summary.json" || true
      node -e "
        const fs=require('fs'),p=process.env.C8_REPORT_DIR ? process.env.C8_REPORT_DIR+'/lcov.info' : 'coverage/lcov.info';
        if(!fs.existsSync(p)){console.error('lcov not found at',p);process.exit(2);}
        const s=fs.readFileSync(p,'utf8');let lf=0,lh=0,bf=0,bh=0,ff=0,fh=0;
        for(const l of s.split(/\r?\n/)){
          if(l.startsWith('LF:'))lf+=+l.slice(3);if(l.startsWith('LH:'))lh+=+l.slice(3);
          if(l.startsWith('BRF:'))bf+=+l.slice(4);if(l.startsWith('BRH:'))bh+=+l.slice(4);
          if(l.startsWith('FNF:'))ff+=+l.slice(4);if(l.startsWith('FNH:'))fh+=+l.slice(4);
        }
        const pct=(h,f)=>f?+(100*h/f).toFixed(2):100;
        const r={stmts:pct(lh,lf),branch:pct(bh,bf),funcs:pct(fh,ff),lines:pct(lh,lf)};
        const out='coverage/'+(process.env.LSC_REPORT_SUBDIR||'')+'/metrics.json';
        fs.writeFileSync(out.replace(/\/+metrics/,'/metrics'), JSON.stringify(r,null,2));
        console.log(JSON.stringify(r));
        const ms=+process.env.LSC_MIN_STMT, mb=+process.env.LSC_MIN_BRANCH, mf=+process.env.LSC_MIN_FUNC;
        let fail=[];
        if(ms && +r.stmts  < ms) fail.push('stmts '+r.stmts+'% < '+ms+'%');
        if(mb && +r.branch < mb) fail.push('branch '+r.branch+'% < '+mb+'%');
        if(mf && +r.funcs  < mf) fail.push('funcs  '+r.funcs+'% < '+mf+'%');
        if(fail.length){ console.error('COVER THRESHOLD FAIL:',fail.join('; ')); process.exit(2); }
      "

    # ---- 产物归档 -----------------------------------------------------
    - |
      echo "==> 归档本次报告: coverage/$LSC_REPORT_SUBDIR/ 与 logs/"
      [ -d coverage/html-report ] && mv coverage/html-report "coverage/$LSC_REPORT_SUBDIR/html" || true
      [ -d coverage/lcov-report ] && mv coverage/lcov-report "coverage/$LSC_REPORT_SUBDIR/lcov-html" || true
      [ -d coverage/platform-admin ] && cp -a coverage/platform-admin "coverage/$LSC_REPORT_SUBDIR/" || true
      [ -d coverage/shared ]         && cp -a coverage/shared         "coverage/$LSC_REPORT_SUBDIR/" || true
      [ -d coverage/base.css ]       && cp -a coverage/*.css coverage/*.js coverage/*.png coverage/index.html "coverage/$LSC_REPORT_SUBDIR/" 2>/dev/null || true
      mv -f 覆盖率报告_P0-图表逻辑_*.html "coverage/$LSC_REPORT_SUBDIR/总览报告.html" 2>/dev/null || true
  coverage: '/Statements\s*:\s*([\d.]+%)/'
  artifacts:
    name: "lsc-coverage-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths:
      - coverage/
      - logs/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml

# ====================================================================
# Stage 2a : Quality · Coverage 硬门控 (独立 Job, c8 checkCoverage 再次兜底)
# ====================================================================
quality:coverage_gate:
  extends: [.node_setup]
  stage: quality
  timeout: 15m
  interruptible: true
  needs:
    - job: build-ci:chart-coverage
      artifacts: false
  script:
    - echo "==> Coverage Gate · c8 硬阈值 Stmt≥${LSC_MIN_STMT}% / Branch≥${LSC_MIN_BRANCH}% / Func≥${LSC_MIN_FUNC}%"
    - |
      # 用 c8 CLI 自己的 --check-coverage / --lines 等参数再次确保硬门控
      # 注意: package.json 的 c8 配置里已内置 checkCoverage + 阈值,这里显式重设双重保险
      set -o pipefail
      npm run coverage 2>&1 | tee logs/coverage-gate.log
      echo "==> c8 exit: ${PIPESTATUS[0]}"
      exit ${PIPESTATUS[0]}
  coverage: '/Statements\s*:\s*([\d.]+%)/'
  artifacts:
    name: "lsc-coverage-gate-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths:
      - logs/coverage-gate.log
      - coverage/coverage-summary.json

# ====================================================================
# Stage 2b : Quality · Assets (体量) + Meta (SEO/OG/schema) 双重严格门控
# ====================================================================
quality:assets_meta_gate:
  extends: [.node_setup]
  stage: quality
  timeout: 12m
  interruptible: true
  needs: []
  script:
    - echo "==> [1/2] Assets Gate · audit:assets:ci --strict (单文件/总大小 + 缺失资源 + HTML/img 引用检测)"
    - npm run audit:assets:ci 2>&1 | tee logs/assets-gate.log
    - RC1=${PIPESTATUS[0]}
    - echo ""
    - echo "==> [2/2] Meta Gate · audit:meta:ci --strict (title/desc/keywords/OG/Twitter/schema/color-scheme)"
    - npm run audit:meta:ci 2>&1 | tee logs/meta-gate.log
    - RC2=${PIPESTATUS[0]}
    - echo ""
    - echo "==> assets exit=$RC1   meta exit=$RC2"
    - if [ "$RC1" -ne 0 ] || [ "$RC2" -ne 0 ]; then echo "ASSETS_META_GATE_FAIL"; exit 2; fi
    - echo "==> ASSETS_META_GATE_PASS ✅"
  artifacts:
    name: "lsc-assets-meta-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 14 days
    paths:
      - logs/assets-gate.log
      - logs/meta-gate.log
      - audit-report/assets-audit.*
      - audit-report/meta-audit.*

# ====================================================================
# Stage 3 : A11y · 16 快照 light/dark 严格门控 (原 test:a11y)
# ====================================================================
a11y:gate_16snap:
  extends: [.node_setup]
  stage: a11y
  timeout: 25m
  interruptible: true
  cache:
    <<: *npm_cache
    policy: pull-push
  variables:
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.cache/playwright-browsers"
    LSC_A11Y_LABEL: "$CI_MERGE_REQUEST_IID ? \"MR-${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}\" : \"${CI_COMMIT_BRANCH}-${CI_COMMIT_SHORT_SHA}\""
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    # ---- 1) Chromium + deps ----
    - echo "==> [A11Y 1/4] 准备 Playwright Chromium  ($PLAYWRIGHT_BROWSERS_PATH)"
    - |
      if grep -qi alpine /etc/os-release 2>/dev/null; then
        apk add --no-cache --virtual=.pw-deps \
          chromium chromium-chromedriver \
          nss harfbuzz freetype ttf-freefont font-noto-cjk \
          mesa-gbm mesa-egl libxkbcommon libxshmfence \
          dbus-libs libevent libvpx opus ffmpeg-libs libwebp \
          libx11 libxcomposite libxdamage libxext libxfixes libxrender libxrandr libxtst libxcb libxkbfile \
          alsa-lib cups-libs pango cairo atk at-spi2-core gtk+3.0 || true
      fi
    - npm run audit:a11y:install 2>&1 | tail -20
    - npx playwright install chromium --with-deps 2>&1 | tail -10 || true

    # ---- 2) 固化 master 基线准备 ----
    - echo "==> [A11Y 2/4] 准备基线文件"
    - |
      mkdir -p audit-report
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        echo "  · 当前为 $CI_COMMIT_BRANCH 分支/Tag, 跑完后将覆盖 a11y-baseline.baseline.json"
        NEED_COMMIT_BASELINE=1
      else
        if [ -f audit-report/a11y-baseline.baseline.json ]; then
          echo "  · 使用项目内置 audit-report/a11y-baseline.baseline.json"
        else
          echo "  · ⚠ 未找到项目内置基线, 将以 strict 阈值 (0 违规) 作为唯一门控,不做 diff 比较"
          SKIP_BASELINE_DIFF=1
        fi
      fi

    # ---- 3) 16 快照严格审计 ----
    - echo "==> [A11Y 3/4] 跑 16 快照 (light + dark) · 严格模式: violations=0 / consoleE=0 / net=0 / missingAlt=0"
    - npm run audit:a11y -- --label="${LSC_A11Y_LABEL:-$CI_COMMIT_SHORT_SHA}"

    # ---- 4) 基线 Diff (MR 阻塞门) ----
    - echo "==> [A11Y 4/4] 与 master 基线 Diff 对比"
    - |
      DIFF_RC=0
      if [ "${SKIP_BASELINE_DIFF:-0}" = "1" ]; then
        echo "  · (skip) 未提供 baseline, diff 步骤跳过"
      else
        if [ ! -f audit-report/a11y-baseline.baseline.json ]; then
          echo "  · ⓘ 首次 master 构建, 将 current 固化为 baseline"
          cp -a audit-report/a11y-baseline.json audit-report/a11y-baseline.baseline.json
        fi
        npm run audit:a11y:diff
        DIFF_RC=$?
        if [ "${NEED_COMMIT_BASELINE:-0}" = "1" ]; then
          cp -a audit-report/a11y-baseline.json audit-report/a11y-baseline.baseline.json
        fi
      fi
    # ---- 5) 归档 + 冒泡 ----
    - |
      OUTDIR="audit-report/$LSC_REPORT_SUBDIR"
      mkdir -p "$OUTDIR"
      for f in audit-report/*.md audit-report/*.json audit-report/*.png; do
        [ -f "$f" ] && cp -a "$f" "$OUTDIR/" 2>/dev/null || true
      done
      ls -la "$OUTDIR" 2>/dev/null || true
      if [ -n "${DIFF_RC+x}" ] && [ "$DIFF_RC" -ne 0 ]; then
        echo "==> [A11Y] diff 失败 (exit=$DIFF_RC), 阻塞当前 Job"
        exit $DIFF_RC
      fi

  artifacts:
    name: "lsc-a11y-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths:
      - audit-report/
    expose_as: "A11y 审计报告"
    reports:
      accessibility: audit-report/a11y-baseline.json

# ====================================================================
# Stage 4 : Pages (可选,只在 master/tag 生成一次公开报告)
# ====================================================================
pages:
  stage: pages
  image: alpine:latest
  needs:
    - job: build-ci:chart-coverage
      artifacts: true
    - job: quality:coverage_gate
      artifacts: false
      optional: true
    - job: quality:assets_meta_gate
      artifacts: true
      optional: true
    - job: a11y:gate_16snap
      artifacts: true
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "==> Assemble GitLab Pages public/"
    - mkdir -p public
    - |
      latest=$(find coverage -maxdepth 1 -mindepth 1 -type d | sort | tail -n1)
      echo "Using latest report dir: $latest"
      if [ -d "$latest/html" ];      then cp -a "$latest/html"          public/html-c8; fi
      if [ -d "$latest/lcov-html" ]; then cp -a "$latest/lcov-html"    public/lcov; fi
      if [ -f "$latest/总览报告.html" ]; then cp -a "$latest/总览报告.html" public/index.html; fi
      if [ ! -f public/index.html ] && [ -f coverage/index.html ]; then
        cp -a coverage public/coverage
        printf '<meta http-equiv="refresh" content="0; url=coverage/index.html" />\n' > public/index.html
      fi
      # A11y 报告归档目录
      if [ -d audit-report ]; then cp -a audit-report public/audit-report; fi
      ls -la public/ || true
  artifacts:
    name: "pages-$CI_COMMIT_SHORT_SHA"
    paths:
      - public
