<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链盛通LSC · 消费者APP V6.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="../shared/design-system.css">
<style>
  body {
    background:
      radial-gradient(circle at 20% 10%, rgba(14,77,74,0.08), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(200,162,75,0.08), transparent 40%),
      var(--c-bg);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; overflow-x: hidden;
  }

  /* 手机外壳 */
  .phone-frame {
    width: 390px;
    height: 820px;
    background: #1a1a1a;
    border-radius: 48px;
    padding: 12px;
    box-shadow: 0 30px 80px rgba(8,46,44,0.35), 0 10px 30px rgba(0,0,0,0.2);
    position: relative;
    flex-shrink: 0;
  }
  .phone-frame::before {
    content:''; position:absolute; top: 22px; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 28px; background: #1a1a1a;
    border-radius: 0 0 18px 18px; z-index: 100;
  }
  .phone-screen {
    width: 100%; height: 100%;
    background: var(--c-bg);
    border-radius: 38px;
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
  }

  /* 状态栏 */
  .status-bar {
    height: 44px; padding: 0 24px 0 30px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600; color: var(--c-text-1);
    flex-shrink: 0; position: relative; z-index: 10;
  }
  .status-bar.dark { color: #fff; background: var(--c-primary-deep); }
  .status-icons { display:flex; align-items:center; gap:6px; }
  .status-icons .icon { width:16px; height:16px; }

  /* 主内容区 */
  .app-content {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    position: relative;
    -webkit-overflow-scrolling: touch;
  }
  .app-content::-webkit-scrollbar { display:none; }
  .screen { display:none; min-height: 100%; animation: fadeIn 0.3s ease; }
  .screen.active { display: block; }

  /* 底部 Tab Bar */
  .tab-bar {
    height: 68px; padding-bottom: 8px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--c-border-soft);
    display: flex; align-items: center;
    flex-shrink: 0; position: relative; z-index: 10;
  }
  .tab-item {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    color: var(--c-text-3); font-size: 10px; cursor:pointer; transition: color 0.2s;
  }
  .tab-item .icon { width:24px; height:24px; }
  .tab-item.active { color: var(--c-primary); font-weight:600; }
  .tab-item.active .icon { color: var(--c-primary); }
  .tab-scan {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--c-primary), var(--c-primary-soft));
    color:#fff; display:flex; align-items:center; justify-content:center;
    margin-top: -24px; box-shadow: 0 6px 18px rgba(14,77,74,0.4);
    border: 4px solid #fff;
  }
  .tab-scan .icon { width: 26px; height:26px; }
  .tab-scan-label { font-size: 10px; color: var(--c-primary); margin-top:2px; font-weight:600; }

  /* 通用页面容器 */
  .pg { padding: 0 16px 20px; }

  /* 首页顶部 */
  .home-hero {
    background: linear-gradient(160deg, var(--c-primary-deep) 0%, var(--c-primary) 60%, var(--c-primary-soft) 120%);
    color: #fff; padding: 8px 20px 90px; position: relative; overflow:hidden;
  }
  .home-hero::before {
    content:''; position:absolute; top:-40px; right:-30px;
    width:200px; height:200px; border-radius:50%;
    background: radial-gradient(circle, rgba(200,162,75,0.25), transparent 60%);
  }
  .home-hero::after {
    content:'LSC'; position:absolute; right:18px; bottom:100px;
    font-size: 60px; font-weight: 900; color: rgba(255,255,255,0.05);
    letter-spacing: -4px; font-family: var(--ff-display);
  }
  .home-top { display:flex; align-items:center; justify-content:space-between; padding: 6px 0 18px; }
  .home-loc { display:flex; align-items:center; gap:4px; font-size:13px; }
  .home-loc .icon { width:14px; height:14px; opacity:0.9; }
  .home-icons { display:flex; gap:14px; }
  .home-icons .icon { width:22px; height:22px; opacity:0.95; }

  /* LSC 钱包卡(悬浮) */
  .wallet-float {
    margin: -70px 16px 0; position: relative; z-index: 5;
  }
  .lsc-card-mobile {
    border-radius: 20px; padding: 20px; color:#fff;
    background: linear-gradient(135deg, var(--c-primary-deep), var(--c-primary) 70%, var(--c-primary-soft));
    box-shadow: 0 16px 32px rgba(8,46,44,0.3);
    position: relative; overflow: hidden;
  }
  .lsc-card-mobile::before {
    content:''; position:absolute; top:-30px; right:-20px;
    width:160px; height:160px; border-radius:50%;
    background: radial-gradient(circle, rgba(200,162,75,0.3), transparent 60%);
  }
  .lsc-card-mobile .wm-label { font-size:11px; opacity:0.75; letter-spacing:1px; }
  .lsc-card-mobile .wm-val { font-size:32px; font-weight:700; font-family:var(--ff-mono); margin-top:2px; letter-spacing:-1px; }
  .lsc-card-mobile .wm-unit { font-size:13px; opacity:0.8; margin-left:4px; font-weight:500; }
  .lsc-card-mobile .wm-foot { display:flex; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,0.15); font-size:12px; }
  .lsc-card-mobile .wm-foot b { font-family:var(--ff-mono); font-size:14px; display:block; margin-top:2px; }

  /* 快捷入口 */
  .quick-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin: 18px 0; }
  .quick-item { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; background:#fff; border-radius:14px; box-shadow: var(--sh-card); }
  .quick-icon {
    width:42px; height:42px; border-radius:12px;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .quick-icon .icon { width:22px; height:22px; }
  .quick-item span { font-size:11px; color:var(--c-text-2); }

  /* 区块标题 */
  .section-head { display:flex; align-items:center; justify-content:space-between; margin: 22px 0 12px; }
  .section-title { font-size:16px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .section-title::before { content:''; width:4px; height:16px; background:var(--c-accent); border-radius:2px; display:inline-block; }
  .section-more { font-size:12px; color:var(--c-text-3); display:flex; align-items:center; gap:2px; }

  /* 商品卡(横向滚动) */
  .h-scroll { display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; margin: 0 -16px; padding-left:16px; padding-right:16px; }
  .h-scroll::-webkit-scrollbar { display:none; }
  .product-m {
    width: 150px; flex-shrink:0; background:#fff; border-radius:14px; overflow:hidden;
    box-shadow: var(--sh-card);
  }
  .product-m-img { height:120px; background:linear-gradient(135deg,var(--c-primary-tint),var(--c-bg-soft)); display:flex; align-items:center; justify-content:center; position:relative; }
  .product-m-img .icon { width:40px; height:40px; color:var(--c-primary); opacity:0.5; }
  .product-m-body { padding:10px; }
  .product-m-name { font-size:13px; font-weight:600; line-height:1.3; height:34px; overflow:hidden; }
  .product-m-price { font-size:16px; font-weight:700; color:var(--c-accent-deep); font-family:var(--ff-mono); margin-top:6px; }
  .product-m-lsc { font-size:11px; color:var(--c-available); }

  /* 附近商家 */
  .merchant-m { display:flex; gap:12px; background:#fff; border-radius:14px; padding:12px; box-shadow:var(--sh-card); margin-bottom:10px; }
  .merchant-m-logo {
    width:56px; height:56px; border-radius:12px; flex-shrink:0;
    background: linear-gradient(135deg, var(--c-accent), var(--c-accent-deep));
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:18px;
  }
  .merchant-m-info { flex:1; min-width:0; }
  .merchant-m-name { font-size:14px; font-weight:600; }
  .merchant-m-meta { font-size:11px; color:var(--c-text-3); margin-top:2px; }
  .merchant-m-dist { font-size:11px; color:var(--c-primary); margin-top:4px; display:flex; align-items:center; gap:3px; }
  .merchant-m-dist .icon { width:12px; height:12px; }

  /* 商城页 */
  .mall-search { padding: 8px 16px 12px; background:#fff; position:sticky; top:0; z-index:5; box-shadow:var(--sh-sm); }
  .mall-cats { display:flex; gap:8px; padding: 0 16px 10px; overflow-x:auto; background:#fff; }
  .mall-cats::-webkit-scrollbar { display:none; }
  .cat-chip { padding:6px 14px; font-size:12px; border-radius:16px; background:var(--c-bg-soft); color:var(--c-text-2); white-space:nowrap; flex-shrink:0; }
  .cat-chip.active { background:var(--c-primary); color:#fff; font-weight:600; }
  .mall-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding: 12px 16px; }
  .mall-card { background:#fff; border-radius:14px; overflow:hidden; box-shadow:var(--sh-card); }
  .mall-card-img { height:140px; background:linear-gradient(135deg,var(--c-primary-tint),var(--c-bg-soft)); display:flex; align-items:center; justify-content:center; }
  .mall-card-img .icon { width:44px; height:44px; color:var(--c-primary); opacity:0.5; }

  /* 线下扫码 */
  .scan-screen { background:#000; min-height:100%; color:#fff; display:flex; flex-direction:column; }
  .scan-area {
    flex:1; position:relative; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at center, rgba(255,255,255,0.05), transparent 70%);
  }
  .scan-frame {
    width: 240px; height:240px; position:relative;
  }
  .scan-corner { position:absolute; width:30px; height:30px; border:3px solid var(--c-accent); }
  .scan-tl { top:0; left:0; border-right:none; border-bottom:none; border-radius:6px 0 0 0; }
  .scan-tr { top:0; right:0; border-left:none; border-bottom:none; border-radius:0 6px 0 0; }
  .scan-bl { bottom:0; left:0; border-right:none; border-top:none; border-radius:0 0 0 6px; }
  .scan-br { bottom:0; right:0; border-left:none; border-top:none; border-radius:0 0 6px 0; }
  .scan-line {
    position:absolute; left:6px; right:6px; top:50%; height:2px;
    background:linear-gradient(90deg,transparent,var(--c-accent),transparent);
    animation: scanMove 2.4s ease-in-out infinite;
  }
  @keyframes scanMove { 0%,100%{ top:10%; } 50%{ top:90%; } }
  .scan-actions { padding: 20px; display:flex; gap:12px; }
  .scan-btn { flex:1; padding:14px; border-radius:12px; background:rgba(255,255,255,0.12); color:#fff; text-align:center; font-size:13px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .scan-btn .icon { width:24px; height:24px; }
  .scan-btn.primary { background:var(--c-accent); }

  /* 付款码 */
  .paycode-screen { background: linear-gradient(180deg, var(--c-primary-deep), var(--c-primary) 40%, var(--c-bg)); min-height:100%; color:#fff; padding: 0 20px 20px; }
  .paycode-tabs { display:flex; gap:8px; margin: 12px 0 24px; }
  .paycode-tab { flex:1; padding:8px; text-align:center; font-size:13px; border-radius:8px; background:rgba(255,255,255,0.1); }
  .paycode-tab.active { background:rgba(255,255,255,0.25); font-weight:600; }
  .paycode-qr {
    width:230px; height:230px; background:#fff; border-radius:16px;
    padding:14px; margin: 0 auto; position:relative;
  }
  .paycode-qr .qr-grid-m {
    width:100%; height:100%;
    background-image:
      linear-gradient(#1a1a1a 1px, transparent 1px),
      linear-gradient(90deg, #1a1a1a 1px, transparent 1px);
    background-size: 8px 8px; position:relative;
  }
  .paycode-qr .qr-corner { position:absolute; width:34px; height:34px; background:#1a1a1a; }
  .paycode-qr .qr-corner::after { content:''; position:absolute; inset:6px; background:#fff; }
  .paycode-qr .qr-corner::before { content:''; position:absolute; inset:12px; background:#1a1a1a; z-index:1; }
  .paycode-qr .qr-tl { top:8px; left:8px; } .paycode-qr .qr-tr { top:8px; right:8px; } .paycode-qr .qr-bl { bottom:8px; left:8px; }
  .paycode-qr .center-logo { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:40px; height:40px; background:var(--c-primary); border-radius:8px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; }
  .paycode-refresh { text-align:center; margin-top:16px; font-size:12px; opacity:0.85; }
  .paycode-amount { text-align:center; margin: 20px 0; }
  .paycode-amount .pa-label { font-size:12px; opacity:0.7; }
  .paycode-amount .pa-val { font-size:28px; font-weight:700; font-family:var(--ff-mono); margin-top:4px; }

  /* 钱包页 */
  .wallet-screen-top { background:linear-gradient(160deg,var(--c-primary-deep),var(--c-primary)); padding: 8px 20px 80px; color:#fff; }
  .wallet-bal { margin-top: 14px; }
  .wallet-bal .wb-label { font-size:12px; opacity:0.75; }
  .wallet-bal .wb-val { font-size:34px; font-weight:700; font-family:var(--ff-mono); margin-top:2px; }
  .wallet-bal .wb-sub { display:flex; gap:24px; margin-top:14px; font-size:12px; }
  .wallet-bal .wb-sub b { font-size:15px; font-family:var(--ff-mono); display:block; margin-top:2px; }
  .wallet-tabs { margin: -60px 16px 0; background:#fff; border-radius:14px; padding:14px; box-shadow:var(--sh-md); position:relative; z-index:5; display:flex; }
  .wallet-tab { flex:1; text-align:center; padding:6px; font-size:12px; color:var(--c-text-2); border-radius:8px; cursor:pointer; }
  .wallet-tab.active { background:var(--c-primary-tint); color:var(--c-primary); font-weight:600; }

  .tx-item { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--c-divider); }
  .tx-item:last-child { border-bottom:none; }
  .tx-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .tx-icon .icon { width:20px; height:20px; }
  .tx-info { flex:1; min-width:0; }
  .tx-title { font-size:14px; font-weight:500; }
  .tx-time { font-size:11px; color:var(--c-text-3); margin-top:2px; }
  .tx-amount { font-family:var(--ff-mono); font-weight:600; font-size:15px; }

  /* 我的页 */
  .me-top { background:linear-gradient(160deg,var(--c-primary-deep),var(--c-primary)); padding: 8px 20px 30px; color:#fff; }
  .me-user { display:flex; align-items:center; gap:14px; margin-top:14px; }
  .me-avatar { width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg,var(--c-accent),var(--c-accent-deep)); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; border:3px solid rgba(255,255,255,0.3); }
  .me-name { font-size:18px; font-weight:700; }
  .me-tag { font-size:11px; opacity:0.8; margin-top:3px; }
  .me-stats { display:flex; gap:8px; margin: 20px 0 0; }
  .me-stat { flex:1; background:rgba(255,255,255,0.1); border-radius:12px; padding:12px; text-align:center; }
  .me-stat .ms-val { font-size:18px; font-weight:700; font-family:var(--ff-mono); }
  .me-stat .ms-label { font-size:11px; opacity:0.8; margin-top:2px; }
  .me-menu { margin: -16px 16px 0; background:#fff; border-radius:14px; box-shadow:var(--sh-md); overflow:hidden; position:relative; z-index:5; }
  .me-menu-item { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--c-divider); }
  .me-menu-item:last-child { border-bottom:none; }
  .me-menu-item .icon { width:20px; height:20px; color:var(--c-primary); }
  .me-menu-item .mm-text { flex:1; font-size:14px; }
  .me-menu-item .arrow { color:var(--c-text-3); }

  /* 订单页 */
  .order-tabs { display:flex; background:#fff; padding: 0 16px; border-bottom:1px solid var(--c-border-soft); }
  .order-tab { flex:1; text-align:center; padding:14px 0; font-size:13px; color:var(--c-text-2); position:relative; }
  .order-tab.active { color:var(--c-primary); font-weight:600; }
  .order-tab.active::after { content:''; position:absolute; bottom:0; left:30%; right:30%; height:3px; background:var(--c-accent); border-radius:2px; }
  .order-card { background:#fff; border-radius:14px; padding:14px; margin: 12px 16px; box-shadow:var(--sh-card); }
  .order-card-head { display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; border-bottom:1px solid var(--c-divider); }
  .order-no { font-size:11px; color:var(--c-text-3); font-family:var(--ff-mono); }
  .order-card-body { display:flex; gap:10px; padding: 10px 0; }
  .order-card-img { width:60px; height:60px; border-radius:8px; background:linear-gradient(135deg,var(--c-primary-tint),var(--c-bg-soft)); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .order-card-img .icon { width:24px; height:24px; color:var(--c-primary); opacity:0.5; }
  .order-card-foot { display:flex; justify-content:space-between; align-items:center; padding-top:10px; border-top:1px solid var(--c-divider); }

  /* 推广页 */
  .promo-hero { background:linear-gradient(135deg,var(--c-accent-deep),var(--c-accent)); color:#fff; padding: 16px 20px 30px; margin: 8px 16px 0; border-radius:18px; position:relative; overflow:hidden; }
  .promo-hero::before { content:''; position:absolute; top:-30px; right:-20px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,0.12); }
  .promo-hero h2 { font-size:20px; margin-bottom:6px; }
  .promo-hero p { font-size:12px; opacity:0.9; }
  .promo-qr-card { margin: -20px 16px 0; background:#fff; border-radius:16px; padding:18px; box-shadow:var(--sh-md); position:relative; z-index:5; text-align:center; }

  /* AI 客服 */
  .ai-chat-screen { display:flex; flex-direction:column; height:100%; background:var(--c-bg-soft); }
  .ai-chat-head { background:#fff; padding: 12px 16px; display:flex; align-items:center; gap:10px; box-shadow:var(--sh-sm); }
  .ai-chat-body { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .ai-chat-body::-webkit-scrollbar { display:none; }
  .ai-chat-input { background:#fff; padding:10px 12px; border-top:1px solid var(--c-border-soft); display:flex; gap:8px; }

  /* 通用按钮 */
  .m-btn { padding:10px 18px; border-radius:10px; font-size:13px; font-weight:500; }
  .m-btn-primary { background:var(--c-primary); color:#fff; }
  .m-btn-accent { background:var(--c-accent); color:#fff; }
  .m-btn-outline { background:transparent; border:1px solid var(--c-border); color:var(--c-text-1); }
  .m-btn-block { display:block; width:100%; text-align:center; }

  /* 混合支付滑块 */
  .hybrid-pay { background:#fff; border-radius:14px; padding:16px; margin: 0 16px; box-shadow:var(--sh-md); }
  .hybrid-bar { position:relative; height:40px; background:var(--c-bg-soft); border-radius:20px; margin:14px 0; display:flex; align-items:center; padding: 0 16px; }
  .hybrid-fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,var(--c-primary),var(--c-available)); border-radius:20px; }
  .hybrid-knob { position:absolute; top:50%; transform:translate(-50%,-50%); width:28px; height:28px; border-radius:50%; background:#fff; box-shadow:var(--sh-md); border:3px solid var(--c-primary); }
  .pay-summary { display:flex; justify-content:space-between; padding:8px 0; font-size:13px; }
  .pay-summary b { font-family:var(--ff-mono); }

  /* 响应: 小屏直接占满 */
  @media (max-width: 430px) {
    body { padding: 0; }
    .phone-frame { width:100vw; height:100vh; border-radius:0; padding:0; }
    .phone-frame::before { display:none; }
    .phone-screen { border-radius:0; }
  }
</style>
</head>
<body>
<div class="phone-frame">
  <div class="phone-screen">
    <!-- 状态栏 -->
    <div class="status-bar" id="statusbar" aria-hidden="true">
      <span>9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M2 22h2V10H2v12zm5 0h2V2H7v20zm5 0h2v-8h-2v8zm5 0h2V6h-2v16z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 3C7 3 2.7 5.9 1 10c1.7 4.1 6 7 11 7s9.3-2.9 11-7c-1.7-4.1-6-7-11-7zm0 12a5 5 0 110-10 5 5 0 010 10z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><rect x="2" y="7" width="18" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="9" width="14" height="6" rx="1"/><rect x="21" y="10" width="2" height="4" rx="1"/></svg>
      </div>
