  .order-card-img { width:60px; height:60px; border-radius:8px; background:linear-gradient(135deg,var(--c-primary-tint),var(--c-bg-soft)); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .order-card-img .icon { width:24px; height:24px; color:var(--c-primary); opacity:0.5; }
  .order-card-foot { display:flex; justify-content:space-between; align-items:center; padding-top:10px; border-top:1px solid var(--c-divider); }

  /* 推广页 */
  .promo-hero { background:linear-gradient(135deg,var(--c-accent-deep),var(--c-accent)); color:#fff; padding: 16px 20px 30px; margin: 8px 16px 0; border-radius:18px; position:relative; overflow:hidden; }
  .promo-hero::before { content:''; position:absolute; top:-30px; right:-20px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,0.12); }
  .promo-hero h2 { font-size:20px; margin-bottom:6px; }
  .promo-hero p { font-size:12px; opacity:0.9; }
  .promo-qr-card { margin: -20px 16px 0; background:#fff; border-radius:16px; padding:18px; box-shadow:var(--sh-md); position:relative; z-index:5; text-align:center; }

  /* AI 客服 */
  .ai-chat-screen { display:flex; flex-direction:column; height:100%; background:var(--c-bg-soft); }
  .ai-chat-head { background:#fff; padding: 12px 16px; display:flex; align-items:center; gap:10px; box-shadow:var(--sh-sm); }
  .ai-chat-body { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .ai-chat-body::-webkit-scrollbar { display:none; }
  .ai-chat-input { background:#fff; padding:10px 12px; border-top:1px solid var(--c-border-soft); display:flex; gap:8px; }

  /* 通用按钮 */
  .m-btn { padding:10px 18px; border-radius:10px; font-size:13px; font-weight:500; }
  .m-btn-primary { background:var(--c-primary); color:#fff; }
  .m-btn-accent { background:var(--c-accent); color:#fff; }
  .m-btn-outline { background:transparent; border:1px solid var(--c-border); color:var(--c-text-1); }
  .m-btn-block { display:block; width:100%; text-align:center; }

  /* 混合支付滑块 */
  .hybrid-pay { background:#fff; border-radius:14px; padding:16px; margin: 0 16px; box-shadow:var(--sh-md); }
  .hybrid-bar { position:relative; height:40px; background:var(--c-bg-soft); border-radius:20px; margin:14px 0; display:flex; align-items:center; padding: 0 16px; }
  .hybrid-fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,var(--c-primary),var(--c-available)); border-radius:20px; }
  .hybrid-knob { position:absolute; top:50%; transform:translate(-50%,-50%); width:28px; height:28px; border-radius:50%; background:#fff; box-shadow:var(--sh-md); border:3px solid var(--c-primary); }
  .pay-summary { display:flex; justify-content:space-between; padding:8px 0; font-size:13px; }
  .pay-summary b { font-family:var(--ff-mono); }

  /* 响应: 小屏直接占满 */
  @media (max-width: 430px) {
    body { padding: 0; }
    .phone-frame { width:100vw; height:100vh; border-radius:0; padding:0; }
    .phone-frame::before { display:none; }
    .phone-screen { border-radius:0; }
  }

  /* 主题切换按钮 (移动端) */
  .theme-toggle {
    position: fixed; top: 58px; right: 12px; z-index: 9999;
    width: 34px; height: 34px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--c-bg-card, #fff);
    color: var(--c-text-1);
    border: 1px solid var(--c-border-soft);
    box-shadow: var(--sh-card);
    cursor: pointer;
    padding: 0;
  }
  .theme-toggle:hover { transform: translateY(-1px); }
  .theme-toggle .tt-icon { width: 18px; height: 18px; display:none; }
  .theme-toggle[data-state="light"] .tt-sun  { display:block; }
  .theme-toggle[data-state="dark"]  .tt-moon { display:block; }
  .theme-toggle[data-state="auto"]  .tt-auto { display:block; }
  @media (prefers-color-scheme: dark) {
    .theme-toggle { background:#151E2E; color:#F1F5F9; border-color:#1E293B; }
  }
  [data-theme="dark"] .theme-toggle { background:#151E2E; color:#F1F5F9; border-color:#1E293B; }

  /* 深色模式覆盖 - 移动端硬编码背景色 */
  @media (prefers-color-scheme: dark) {
    .status-bar.dark { background: #082E2C; }
    .tab-bar { background: rgba(21,30,46,0.96); border-top-color: #1E293B; }
    .phone-screen { background: #0E1520; }
    .quick-item { background: #151E2E; color: #F1F5F9; }
    .quick-item span { color: #CBD5E1; }
    /* 横向产品卡片 / 商家卡硬编码白色背景 */
    .product-m { background: #151E2E; }
    .product-m-name { color: #F1F5F9; }
    .product-m-price { color: #D4AF50; }          /* 替代提亮的 var(--c-accent-deep) */
    .product-m-lsc { color: #48C986; }             /* 替代提亮的 var(--c-available) */
    .merchant-m { background: #151E2E; }
    .product-m-img { background: linear-gradient(135deg,#1A2F3D,#111A28); }
  }
  [data-theme="dark"] .status-bar.dark { background: #082E2C; }
  [data-theme="dark"] .tab-bar { background: rgba(21,30,46,0.96); border-top-color: #1E293B; }
  [data-theme="dark"] .phone-screen { background: #0E1520; }
  [data-theme="dark"] .quick-item { background: #151E2E; color: #F1F5F9; }
  [data-theme="dark"] .quick-item span { color: #CBD5E1; }
  [data-theme="dark"] .product-m { background: #151E2E; }
  [data-theme="dark"] .product-m-name { color: #F1F5F9; }
  [data-theme="dark"] .product-m-price { color: #D4AF50; }
  [data-theme="dark"] .product-m-lsc { color: #48C986; }
  [data-theme="dark"] .merchant-m { background: #151E2E; }
  [data-theme="dark"] .product-m-img { background: linear-gradient(135deg,#1A2F3D,#111A28); }
</style>
</head>

<script>
// PWA Service Worker 注册：scope 限定 /mobile-app/，避免接管其他端
(function () {
  if ('serviceWorker' in navigator) {
    var swUrl = './sw.js';
    var scope = './';
    function reg() {
      try {
        navigator.serviceWorker.register(swUrl, { scope: scope, updateViaCache: 'imports' })
          .then(function (reg) {
            if (typeof window.__LSC_SW === 'undefined') window.__LSC_SW = {};
            window.__LSC_SW.registered = true;
            window.__LSC_SW.scope = (reg && reg.scope) || scope;
            if (reg && reg.waiting) { try { reg.waiting.postMessage({type:'LSC_SW_SKIP_WAITING'}); } catch(_) {} }
          })
          .catch(function(){});
      } catch(_) {}
    }
    if (window.addEventListener) window.addEventListener('load', reg, { once:true, passive:true });
    else setTimeout(reg, 1500);
  }
})();
</script>
<script>
(function initKbMobile(){
  function go() {
    try { LSCKeyboardA11y.init({ appPrefix: 'mobile' }); } catch(_) {}
    setTimeout(function () { try { LSCKeyboardA11y.refreshRoving(); } catch (_) {} }, 30);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go, { once: true });
  else go();
})();
</script>
<script src="app.js"></script>
<script>
/* 移动端主题切换: 三态 auto → light → dark, 持久化到 localStorage, 读档时自动同步 data-theme */
(function(){
  const KEY = 'lsc-mobile-theme';
  const STATES = ['auto','light','dark'];
  // ---- theme-color meta 快照 ----
  const metas = Array.from(document.querySelectorAll('meta[name="theme-color"]'));
  const savedMeta = metas.map(m => ({ el:m, media:m.getAttribute('media') || '', content:m.getAttribute('content') || '' }));
  function applyMetaColor(mode){
    if (!savedMeta.length) return;
    if (mode === 'light') {
      savedMeta.forEach(s => { s.el.setAttribute('media','all'); s.el.setAttribute('content','#F5F3EC'); });
    } else if (mode === 'dark') {
      savedMeta.forEach(s => { s.el.setAttribute('media','all'); s.el.setAttribute('content','#082E2C'); });
    } else {
      savedMeta.forEach(s => { s.el.setAttribute('media', s.media); s.el.setAttribute('content', s.content); });
    }
  }
  const btn = document.getElementById('themeToggle');
  function apply(mode){
    const root = document.documentElement;
    if (mode === 'dark') root.setAttribute('data-theme','dark');
    else root.removeAttribute('data-theme');
    if (mode === 'light') {
      // Force light even if OS is dark: set data-theme=light to neutralize prefers-color-scheme
      root.setAttribute('data-theme','light');
      // Also set CSS color-scheme to force scrollbars etc.
      root.style.colorScheme = 'light';
    } else if (mode === 'dark') {
      root.style.colorScheme = 'dark';
    } else {
      root.style.colorScheme = 'light dark';
    }
    btn && btn.setAttribute('data-state', mode);
    btn && btn.setAttribute('aria-pressed', mode !== 'auto');
    // 语音播报状态
    const label = { auto: '跟随系统', light: '浅色模式', dark: '深色模式' }[mode];
    btn && btn.setAttribute('aria-label', '切换主题，当前：' + label);
    applyMetaColor(mode);
  }
  // 初始化 - 尽早应用(首次渲染前)以避免闪烁
  const saved = (localStorage.getItem(KEY) || 'auto');
  apply(saved);
  if (btn) {
    btn.addEventListener('click', function(){
      const cur = btn.getAttribute('data-state') || 'auto';
      const next = STATES[(STATES.indexOf(cur) + 1) % STATES.length];
      localStorage.setItem(KEY, next);
      apply(next);
    });
  }
  // 响应 data-theme=light 强制浅色：给 :root[data-theme="light"] 提供变量覆盖
  // 当 data-theme 被设为 non-dark，则 prefers-color-scheme 不再生效，这里补充 light 变量兜底。
  const style = document.createElement('style');
  style.textContent = ':root[data-theme="light"]{ --c-bg:#F5F3EC;--c-bg-card:#FFFFFF;--c-bg-soft:#FAF8F2;--c-bg-dark:#082E2C;--c-text-1:#1A1F2E;--c-text-2:#4B5563;--c-text-3:#525A66;--c-text-inv:#FFFFFF;--c-text-on-colored:#FFFFFF;--c-border:#E3DFD3;--c-border-soft:#EFEBE0;--c-divider:#EDE9DC; }';
  document.head.appendChild(style);
})();
</script>
