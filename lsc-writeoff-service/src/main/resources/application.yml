server:
  port: 8105
  servlet:
    context-path: /lsc-writeoff

spring:
  application:
    name: lsc-writeoff-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: LSC_GROUP
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: LSC_GROUP
        file-extension: yaml
        shared-configs:
          - data-id: lsc-common-datasource.yaml
            group: LSC_GROUP
            refresh: true
          - data-id: lsc-common-infra.yaml
            group: LSC_GROUP
            refresh: true
          - data-id: lsc-common-redis.yaml
            group: LSC_GROUP
            refresh: true
  # 数据源
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1:3306}/lsc_writeoff?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&&rewriteBatchedStatements=true
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
    username: ${MYSQL_USER}
    password: ${MYSQL_PWD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=1000
  # Redis
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
      database: ${REDIS_DB:5}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.lianshengtong.writeoff.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

# Seata AT 模式配置
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: lsc_tx_group
  service:
    vgroup-mapping:
      lsc_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:127.0.0.1:8091}
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR:nacos:8848}
      namespace: ${NACOS_NAMESPACE:public}
      group: SEATA_GROUP
      application: seata-server
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR:nacos:8848}
      namespace: ${NACOS_NAMESPACE:public}
      group: SEATA_GROUP
  data-source-proxy-mode: AT
  enable-auto-data-source-proxy: true

# Redisson 分布式锁配置
redisson:
  config: |
    singleServerConfig:
      address: "redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}"
      password: ${REDIS_PWD}
      database: ${REDIS_DB:5}
      connectionMinimumIdleSize: 8
      connectionPoolSize: 32
      idleConnectionTimeout: 10000
      connectTimeout: 5000
      timeout: 3000
      retryAttempts: 3
      retryInterval: 1500
    threads: 8
    nettyThreads: 16
    codec: !<org.redisson.codec.JsonJacksonCodec> {}

# 业务配置
lsc:
  writeoff:
    # 核销兑换比例(分): LSC 100 兑换现金 87
    cash-ratio-numerator: 87
    cash-ratio-denominator: 100
    # 一级处罚限额比例(50%)
    level1-limit-ratio: 50
    # 分布式锁等待时间(毫秒)
    lock-wait-ms: 3000
    # 分布式锁租约时间(毫秒)
    lock-lease-ms: 10000

# Feign
feign:
  okhttp:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 5000

# 日志
logging:
  level:
    root: INFO
    com.lianshengtong.writeoff: DEBUG
    com.lianshengtong.common: INFO
    com.baomidou.mybatisplus: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: writeoff
      paths-to-match: /api/**
      packages-to-scan: com.lianshengtong.writeoff.controller
