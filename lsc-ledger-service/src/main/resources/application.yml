server:
  port: 8102
  servlet:
    context-path: /lsc-ledger

spring:
  application:
    name: lsc-ledger-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: LSC_GROUP
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: LSC_GROUP
        file-extension: yaml
        shared-configs:
          - data-id: lsc-common-datasource.yaml
            group: LSC_GROUP
            refresh: true
          - data-id: lsc-common-infra.yaml
            group: LSC_GROUP
            refresh: true
          - data-id: lsc-common-redis.yaml
            group: LSC_GROUP
            refresh: true
  # 数据源
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1:3306}/lsc_ledger?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&&rewriteBatchedStatements=true
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
    username: ${MYSQL_USER}
    password: ${MYSQL_PWD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=1000
  # ============ 分库分表配置示例 (ShardingSphere 8库32表, 按 user_id 取模) ============
  # 生产环境启用 shardingsphere-jdbc 时, 注释上方单库 datasource 并启用以下配置:
  # shardingsphere:
  #   datasource:
  #     names: ds0,ds1,ds2,ds3,ds4,ds5,ds6,ds7
  #     ds0: { type: com.alibaba.druid.pool.DruidDataSource, driver-class-name: com.mysql.cj.jdbc.Driver,
  #            url: jdbc:mysql://127.0.0.1:3306/lsc_ledger_0?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&&rewriteBatchedStatements=true,
  #            username: root, password: root }
  #     # ds1 ~ ds7 同理, 库名 lsc_ledger_1 ~ lsc_ledger_7
  #   rules:
  #     sharding:
  #       tables:
  #         lsc_accounts:
  #           actual-data-nodes: ds$->{0..7}.lsc_accounts$->{0..31}
  #           database-strategy: { standard: { sharding-column: user_id, sharding-algorithm-name: db-mod } }
  #           table-strategy: { standard: { sharding-column: user_id, sharding-algorithm-name: tbl-mod } }
  #         lsc_transactions:
  #           actual-data-nodes: ds$->{0..7}.lsc_transactions$->{0..31}
  #           database-strategy: { standard: { sharding-column: user_id, sharding-algorithm-name: db-mod } }
  #           table-strategy: { standard: { sharding-column: user_id, sharding-algorithm-name: tbl-mod } }
  #         available_lsc_details:
  #           actual-data-nodes: ds$->{0..7}.available_lsc_details$->{0..31}
  #           database-strategy: { standard: { sharding-column: user_id, sharding-algorithm-name: db-mod } }
  #           table-strategy: { standard: { sharding-column: user_id, sharding-algorithm-name: tbl-mod } }
  #       sharding-algorithms:
  #         db-mod: { type: MOD, props: { sharding-count: 8 } }
  #         tbl-mod: { type: MOD, props: { sharding-count: 32 } }
  # ============ Redis 集群模式 ============
  data:
    redis:
      # 集群模式示例 (生产环境推荐 3主3从)
      cluster:
        nodes:
          - ${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}
          - ${REDIS_HOST:127.0.0.1}:6380
          - ${REDIS_HOST:127.0.0.1}:6381
          - ${REDIS_HOST:127.0.0.1}:6382
          - ${REDIS_HOST:127.0.0.1}:6383
          - ${REDIS_HOST:127.0.0.1}:6384
        max-redirects: 3
      password: ${REDIS_PWD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
        cluster:
          refresh:
            adaptive: true
            period: 30s
  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.lianshengtong.ledger.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

# Seata AT 模式配置
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: lsc_tx_group
  service:
    vgroup-mapping:
      lsc_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:127.0.0.1:8091}
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR:nacos:8848}
      namespace: ${NACOS_NAMESPACE:public}
      group: SEATA_GROUP
      application: seata-server
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR:nacos:8848}
      namespace: ${NACOS_NAMESPACE:public}
      group: SEATA_GROUP
  data-source-proxy-mode: AT
  enable-auto-data-source-proxy: true

# Redisson 分布式锁配置 (集群模式)
redisson:
  config: |
    clusterServersConfig:
      nodeAddresses:
        - "redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}"
        - "redis://${REDIS_HOST:127.0.0.1}:6380"
        - "redis://${REDIS_HOST:127.0.0.1}:6381"
        - "redis://${REDIS_HOST:127.0.0.1}:6382"
        - "redis://${REDIS_HOST:127.0.0.1}:6383"
        - "redis://${REDIS_HOST:127.0.0.1}:6384"
      password: ${REDIS_PWD:}
      scanInterval: 1000
      readMode: "SLAVE"
      subscriptionMode: "SLAVE"
      slaveConnectionMinimumIdleSize: 8
      slaveConnectionPoolSize: 32
      masterConnectionMinimumIdleSize: 8
      masterConnectionPoolSize: 32
      idleConnectionTimeout: 10000
      connectTimeout: 5000
      timeout: 3000
      retryAttempts: 3
      retryInterval: 1500
    threads: 8
    nettyThreads: 16
    codec: !<org.redisson.codec.JsonJacksonCodec> {}

# 业务配置
lsc:
  ledger:
    # 分布式锁等待时间(毫秒)
    lock-wait-ms: 3000
    # 分布式锁租约时间(毫秒)
    lock-lease-ms: 10000
    # B2B流转接收方LSC有效期重置天数
    b2b-validity-days: 365
    # 过期转回批量大小
    expire-batch-size: 500

# 日志
logging:
  level:
    root: INFO
    com.lianshengtong.ledger: DEBUG
    com.lianshengtong.common: INFO
    com.baomidou.mybatisplus: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: ledger
      paths-to-match: /api/**
      packages-to-scan: com.lianshengtong.ledger.controller
