# ============================================================
# K8s补充微服务Deployment清单
# 包含: promotion, mall, risk, reconciliation, media, map, evidence
# 前端: merchant-web (Nginx)
# Ingress更新: admin.lianshengtong.com -> merchant-web
# ============================================================

# ---- 营销推广服务 ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsc-promotion-service
  namespace: lsc-system
  labels:
    app: lsc-promotion-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lsc-promotion-service
  template:
    metadata:
      labels:
        app: lsc-promotion-service
    spec:
      containers:
        - name: lsc-promotion-service
          image: registry.cn-hangzhou.aliyuncs.com/lsc/promotion-service:6.2.0
          ports:
            - containerPort: 8107
          envFrom:
            - configMapRef:
                name: lsc-config
            - secretRef:
                name: lsc-secrets
          env:
            - name: SERVER_PORT
              value: "8107"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8107
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8107
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: lsc-promotion-service
  namespace: lsc-system
spec:
  type: ClusterIP
  ports:
    - port: 8107
      targetPort: 8107
  selector:
    app: lsc-promotion-service

