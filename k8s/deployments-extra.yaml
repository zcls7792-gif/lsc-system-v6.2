# ============================================================
# 前端 - 商户管理后台 (Nginx)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsc-merchant-web
  namespace: lsc-system
  labels:
    app: lsc-merchant-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lsc-merchant-web
  template:
    metadata:
      labels:
        app: lsc-merchant-web
    spec:
      containers:
        - name: lsc-merchant-web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-html
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-html
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: lsc-merchant-web-nginx-conf
            optional: true

---
apiVersion: v1
kind: Service
metadata:
  name: lsc-merchant-web
  namespace: lsc-system
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: lsc-merchant-web

---
# ============================================================
# Ingress更新 - admin.lianshengtong.com -> merchant-web
# 注意: 此Ingress替换原有deployments.yaml中的同名Ingress
#       如需保留原Ingress，请修改此文件中的name
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lsc-ingress
  namespace: lsc-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "200"
    nginx.ingress.kubernetes.io/limit-connections: "1000"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-hide-header: "X-Powered-By,Server"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.lianshengtong.com
        - admin.lianshengtong.com
      secretName: lsc-tls-secret
  rules:
    - host: api.lianshengtong.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lsc-gateway
                port:
                  number: 8000
    - host: admin.lianshengtong.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lsc-merchant-web
                port:
                  number: 80