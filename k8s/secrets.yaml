# ============================================================
# 链盛通LSC系统 - K8s Secret 模板
# ============================================================
# ⚠️ 安全警告:
#   1. 本文件为模板，所有值均为占位符，禁止填入真实密钥后提交到代码仓库。
#   2. 生产环境必须通过以下任一方式注入真实密钥:
#      a) kubectl create secret generic lsc-secrets --from-env-file=.env.secret -n lsc-system
#      b) 使用 Sealed Secrets / External Secrets / HashiCorp Vault
#      c) 云厂商 KMS 托管
#   3. 若历史提交中曾包含真实密钥，必须立即轮换全部密钥并清理 Git 历史。
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: lsc-secrets
  namespace: lsc-system
  annotations:
    # 标记为模板，部署时需覆盖
    lsc.lianshengtong.com/managed-by: "external-secrets"
type: Opaque
stringData:
  # 数据库 - 部署时通过 kubectl create secret 注入
  MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
  MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
  MYSQL_USER: "${MYSQL_USER}"

  # Redis 集群
  REDIS_PASSWORD: "${REDIS_PASSWORD}"

  # RabbitMQ
  RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"

  # Nacos
  NACOS_PASSWORD: "${NACOS_PASSWORD}"

  # JWT - 至少 32 字节，使用 openssl rand -base64 48 生成
  JWT_SECRET: "${JWT_SECRET}"

  # 各角色初始密码
  ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
  AUDITOR_PASSWORD: "${AUDITOR_PASSWORD}"
  OPERATOR_PASSWORD: "${OPERATOR_PASSWORD}"

  # 区块链节点
  CHAIN_RPC_URL: "${CHAIN_RPC_URL}"
  CHAIN_CONTRACT: "${CHAIN_CONTRACT}"
  CHAIN_PK: "${CHAIN_PK}"

  # AI 服务
  AI_API_KEY: "${AI_API_KEY}"
  AI_ENDPOINT: "${AI_ENDPOINT}"

  # 监控
  GRAFANA_PASSWORD: "${GRAFANA_PASSWORD}"

  # 任务调度
  XXL_JOB_TOKEN: "${XXL_JOB_TOKEN}"
