# ============================================================
# K8s Services - 所有微服务 Service 清单
# 可单独应用: kubectl apply -f k8s/services.yaml
# ============================================================

# ---- API网关 ----
apiVersion: v1
kind: Service
metadata:
  name: lsc-gateway
  namespace: lsc-system
  labels:
    app: lsc-gateway
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: lsc-gateway

---
