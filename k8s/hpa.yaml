# ============================================================
# HorizontalPodAutoscaler — 生产环境自动扩缩容
# 核心服务根据 CPU/Memory 使用率自动伸缩
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lsc-gateway-hpa
  namespace: lsc-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lsc-gateway
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
