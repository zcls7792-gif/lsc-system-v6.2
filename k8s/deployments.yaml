    spec:
      containers:
        - name: lsc-b2b-service
          image: registry.cn-hangzhou.aliyuncs.com/lsc/b2b-service:6.2.0
          ports: [{ containerPort: 8103 }]
          envFrom: [{ configMapRef: { name: lsc-config } }, { secretRef: { name: lsc-secrets } }]
          env: [{ name: SERVER_PORT, value: "8103" }]
          resources: { requests: { cpu: "250m", memory: "512Mi" }, limits: { cpu: "500m", memory: "1Gi" } }
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8103 }
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8103 }
            initialDelaySeconds: 30
            periodSeconds: 10

