# ============================================================
# K8s后端微服务Deployment统一模板
# 通过env注入微服务名，一个文件部署所有服务
# ============================================================

# ---- API网关 ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsc-gateway
  namespace: lsc-system
  labels:
    app: lsc-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lsc-gateway
  template:
    metadata:
      labels:
        app: lsc-gateway
    spec:
      containers:
        - name: lsc-gateway
          image: registry.cn-hangzhou.aliyuncs.com/lsc/gateway:6.2.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: lsc-config
            - secretRef:
                name: lsc-secrets
          env:
            - name: SERVER_PORT
              value: "8000"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: lsc-gateway
  namespace: lsc-system
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: lsc-gateway

