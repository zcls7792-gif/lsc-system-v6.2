# ---- LSC账本服务 (核心服务，3副本) ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsc-ledger-service
  namespace: lsc-system
  labels:
    app: lsc-ledger-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lsc-ledger-service
  template:
    metadata:
      labels:
        app: lsc-ledger-service
    spec:
      containers:
        - name: lsc-ledger-service
          image: registry.cn-hangzhou.aliyuncs.com/lsc/ledger-service:6.2.0
          ports:
            - containerPort: 8102
          envFrom:
            - configMapRef:
                name: lsc-config
            - secretRef:
                name: lsc-secrets
          env:
            - name: SERVER_PORT
              value: "8102"
            - name: JAVA_OPTS
              value: "-Xms1g -Xmx2g -XX:+UseG1GC"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8102
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8102
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: lsc-ledger-service
  namespace: lsc-system
spec:
  type: ClusterIP
  ports:
    - port: 8102
      targetPort: 8102
  selector:
    app: lsc-ledger-service

