# ============================================================
# Ingress - 统一入口 (含 TLS)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lsc-ingress
  namespace: lsc-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "200"
    nginx.ingress.kubernetes.io/limit-connections: "1000"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-hide-header: "X-Powered-By,Server"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.lianshengtong.com
        - admin.lianshengtong.com
      secretName: lsc-tls-secret
  rules:
    - host: api.lianshengtong.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lsc-gateway
                port:
                  number: 8000
    - host: admin.lianshengtong.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lsc-gateway
                port:
                  number: 8000
