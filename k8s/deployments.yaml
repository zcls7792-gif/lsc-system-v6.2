# ---- 释放计算服务 (单实例，XXL-JOB限制单实例执行) ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lsc-release-service
  namespace: lsc-system
  labels:
    app: lsc-release-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lsc-release-service
  template:
    metadata:
      labels:
        app: lsc-release-service
    spec:
      containers:
        - name: lsc-release-service
          image: registry.cn-hangzhou.aliyuncs.com/lsc/release-service:6.2.0
          ports:
            - containerPort: 8106
          envFrom:
            - configMapRef:
                name: lsc-config
            - secretRef:
                name: lsc-secrets
          env:
            - name: SERVER_PORT
              value: "8106"
            - name: JAVA_OPTS
              value: "-Xms1g -Xmx2g -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8106
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8106
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: lsc-release-service
  namespace: lsc-system
spec:
  type: ClusterIP
  ports:
    - port: 8106
      targetPort: 8106
  selector:
    app: lsc-release-service

