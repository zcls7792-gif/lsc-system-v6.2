server:
  port: 8110
  servlet:
    context-path: /lsc-media

spring:
  application:
    name: lsc-media-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: LSC_GROUP
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: LSC_GROUP
        file-extension: yaml
        shared-configs:
          - data-id: lsc-common-datasource.yaml
            group: LSC_GROUP
            refresh: true
          - data-id: lsc-common-infra.yaml
            group: LSC_GROUP
            refresh: true
          - data-id: lsc-common-redis.yaml
            group: LSC_GROUP
            refresh: true
  # ============ 数据源 (MySQL 8.0, 8库分库分表: lsc_media库, media_files表按id取模32, 媒体元数据存储) ============
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1:3306}/lsc_media?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&&rewriteBatchedStatements=true
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
    username: ${MYSQL_USER}
    password: ${MYSQL_PWD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
  # ============ Redis 集群 (CDN URL缓存) ============
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
      database: ${REDIS_DB:10}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus (媒体元数据)
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.lianshengtong.media.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# 业务配置 - 云存储双备份
lsc:
  media:
    # 阿里云 OSS (主)
    oss:
      endpoint: ${OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
      access-key-id: ${OSS_AK:}
      access-key-secret: ${OSS_SK:}
      bucket: ${OSS_BUCKET:lsc-media}
      cdn-domain: ${OSS_CDN:https://cdn.lsc-media.com}
    # 腾讯云 COS (备份)
    cos:
      region: ${COS_REGION:ap-guangzhou}
      secret-id: ${COS_ID:}
      secret-key: ${COS_KEY:}
      bucket: ${COS_BUCKET:lsc-media-1300000000}
      cdn-domain: ${COS_CDN:https://cdn2.lsc-media.com}
    # 视频转码三档
    video:
      max-size-mb: 100
      min-duration-sec: 15
      max-duration-sec: 180
      allowed-types: mp4,mov,avi
      # 转码档位 720P/480P/360P
      transcode-profiles: 720p,480p,360p
    # 图片
    image:
      max-size-mb: 10
      allowed-types: jpg,jpeg,png,gif,webp

# 日志
logging:
  level:
    root: INFO
    com.lianshengtong.media: DEBUG
    com.lianshengtong.common: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: media
      paths-to-match: /api/**
      packages-to-scan: com.lianshengtong.media.controller
