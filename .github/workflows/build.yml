name: Build, Test & Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build, Test & Coverage (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Compile all modules
        run: mvn -B -ntp -T 1C clean compile -DskipTests

      - name: Run unit tests with JaCoCo coverage
        run: mvn -B -ntp test

      - name: Aggregate Surefire summary (7-service matrix)
        if: always()
        run: |
          echo "### Surefire Summary (Java 7 Services)" >> $GITHUB_STEP_SUMMARY
          total=0; failed=0; errors=0; skipped=0
          for f in $(find . -name 'TEST-*.xml' -path '*/target/surefire-reports/*' 2>/dev/null); do
            t=$(grep -oE 'tests="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || echo 0)
            f_=$(grep -oE 'failures="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || echo 0)
            e=$(grep -oE 'errors="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || echo 0)
            s=$(grep -oE 'skipped="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || echo 0)
            total=$((total + t)); failed=$((failed + f_)); errors=$((errors + e)); skipped=$((skipped + s))
          done
          {
            echo "- **Total tests:** $total"
            echo "- **Failures:** $failed"
            echo "- **Errors:** $errors"
            echo "- **Skipped:** $skipped"
          } >> $GITHUB_STEP_SUMMARY
          if [ "$failed" -gt 0 ] || [ "$errors" -gt 0 ]; then
            echo "::warning::Surefire aggregate — $failed failures, $errors errors (total $total)."
          fi

      - name: Generate JaCoCo coverage report
        run: mvn -B -ntp jacoco:report

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-coverage-reports
          path: '**/target/jacoco/**'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo XML reports (for coverage badge services)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-xml
          path: '**/target/jacoco/jacoco.xml'
          if-no-files-found: ignore
          retention-days: 14

      - name: Check coverage thresholds (Quality Gate)
        run: mvn -B -ntp jacoco:check

      - name: Package without tests
        run: mvn -B -ntp -T 1C package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: service-jars
          path: '**/target/lsc-*.jar'
          if-no-files-found: warn
          retention-days: 14

  contract-testing:
    name: Contract Tests (Provider Verifier + Consumer Stub Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        role:
          - name: provider-verifier
            desc: "Run Spring Cloud Contract verifier tests on 4 provider services"
            phases: |
              mvn -B -ntp -pl lsc-ledger-service,lsc-order-service,lsc-user-service,lsc-promotion-service \
                  test -Dtest='*Contract*Test,UserTest,LedgerTest,OrderTest,PromotionTest' \
                  -DfailIfNoTests=false \
                  -Dsurefire.failIfNoSpecifiedTests=false
          - name: consumer-stub-runner
            desc: "Run consumer-side stub runner tests on 3 consumer services"
            phases: |
              # Step 1: Install stubs of all 4 provider services into local Maven repo
              mvn -B -ntp -pl lsc-ledger-service,lsc-order-service,lsc-user-service,lsc-promotion-service \
                  install -DskipTests -Dmaven.javadoc.skip=true
              # Step 2: Run consumer stub tests
              mvn -B -ntp -pl lsc-order-service \
                  test -Dtest='OrderConsumerLedgerStubTest,OrderConsumerPromotionStubTest' -DfailIfNoTests=false
              mvn -B -ntp -pl lsc-promotion-service \
                  test -Dtest='PromotionConsumerUserStubTest' -DfailIfNoTests=false
              mvn -B -ntp -pl lsc-mall-service \
                  test -Dtest='MallConsumerOrderStubTest' -DfailIfNoTests=false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-contract-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
            ${{ runner.os }}-m2-contract-

      - name: Compile before contract run
        run: mvn -B -ntp -T 1C clean compile test-compile -DskipTests

      - name: ${{ matrix.role.name }}
        run: |
          set -euo pipefail
          cat <<'PHASE' > /tmp/phase.sh
          ${{ matrix.role.phases }}
          PHASE
          bash /tmp/phase.sh

      - name: Aggregate contract test summary
        if: always()
        run: |
          echo "### Contract Test Summary — ${{ matrix.role.name }}" >> $GITHUB_STEP_SUMMARY
          total=0; failed=0; errors=0; skipped=0
          for f in $(find . -name 'TEST-*.xml' -path '*/target/surefire-reports/*' 2>/dev/null); do
            t=$(grep -oE 'tests="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || echo 0)
            f_=$(grep -oE 'failures="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || echo 0)
            e=$(grep -oE 'errors="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || echo 0)
            s=$(grep -oE 'skipped="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || echo 0)
            total=$((total + t)); failed=$((failed + f_)); errors=$((errors + e)); skipped=$((skipped + s))
          done
          {
            echo "- **Role:** ${{ matrix.role.name }} — ${{ matrix.role.desc }}"
            echo "- **Total contract tests:** $total"
            echo "- **Failures:** $failed"
            echo "- **Errors:** $errors"
            echo "- **Skipped:** $skipped"
          } >> $GITHUB_STEP_SUMMARY
          if [ "$failed" -gt 0 ] || [ "$errors" -gt 0 ]; then
            echo "::error::Contract testing failed — $failed failures, $errors errors (total $total)."
          fi

      - name: Upload contract test surefire reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: contract-surefire-${{ matrix.role.name }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7

  integration-testing:
    name: Integration Tests (Controller MockMvc + Gateway Filter)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: user-service (User + Merchant)
            module: lsc-user-service
            tests: UserControllerStandaloneTest,MerchantControllerStandaloneTest
          - name: ledger-service (LscLedger)
            module: lsc-ledger-service
            tests: LscLedgerControllerStandaloneTest
          - name: mall-service (Product)
            module: lsc-mall-service
            tests: ProductControllerStandaloneTest
          - name: admin-service (Admin + ParamConfig)
            module: lsc-admin-service
            tests: AdminControllerStandaloneTest,ParamConfigControllerStandaloneTest
          - name: gateway (JWT Filter + KeyResolver)
            module: lsc-gateway
            tests: JwtAuthFilterTest,RateLimitConfigTest,GatewayEdgeCaseTest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-itest-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
            ${{ runner.os }}-m2-itest-

      - name: Compile integration test classes (install lsc-common first)
        run: |
          set -euo pipefail
          mvn -B -ntp -pl lsc-common -am install -DskipTests
          mvn -B -ntp -pl ${{ matrix.module.module }} test-compile -DskipTests

      - name: Run integration tests — ${{ matrix.module.name }}
        run: |
          set -euo pipefail
          mvn -B -ntp -pl ${{ matrix.module.module }} \
              test \
              -Dtest='${{ matrix.module.tests }}' \
              -DfailIfNoTests=false \
              -Dsurefire.failIfNoSpecifiedTests=false

      - name: Aggregate integration test summary
        if: always()
        run: |
          echo "### Integration Test Summary — ${{ matrix.module.name }}" >> $GITHUB_STEP_SUMMARY
          total=0; failed=0; errors=0; skipped=0
          for f in $(find ./${{ matrix.module.module }}/target/surefire-reports -name 'TEST-*.xml' 2>/dev/null); do
            t=$(grep -oE 'tests="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || echo 0)
            f_=$(grep -oE 'failures="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || echo 0)
            e=$(grep -oE 'errors="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || echo 0)
            s=$(grep -oE 'skipped="[0-9]+"' "$f" | head -1 | grep -oE '[0-9]+' || echo 0)
            total=$((total + t)); failed=$((failed + f_)); errors=$((errors + e)); skipped=$((skipped + s))
          done
          {
            echo "- **Module:** ${{ matrix.module.name }} (${{ matrix.module.module }})"
            echo "- **Tests matched:** ${{ matrix.module.tests }}"
            echo "- **Total itests:** $total"
            echo "- **Failures:** $failed"
            echo "- **Errors:** $errors"
            echo "- **Skipped:** $skipped"
          } >> $GITHUB_STEP_SUMMARY
          if [ "$failed" -gt 0 ] || [ "$errors" -gt 0 ]; then
            echo "::error::Integration tests failed on ${{ matrix.module.name }} — $failed failures, $errors errors (total $total)."
            exit 1
          fi

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-surefire-${{ matrix.module.module }}
          path: '${{ matrix.module.module }}/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7

  gray-and-observability:
    name: Gray Release & Observability (Gateway Tier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install lsc-common locally (gateway depends on it)
        run: mvn -B -ntp -pl lsc-common -am install -DskipTests

      - name: Compile lsc-gateway (gray + observability source)
        run: mvn -B -ntp -pl lsc-gateway clean compile test-compile -DskipTests

      - name: (a) 灰度策略 CRUD 验证 (GrayPolicyStore + Controller)
        run: |
          mvn -B -ntp -pl lsc-gateway test \
            -Dtest='GrayPolicyStoreTest,GrayReleaseControllerTest' \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      - name: (b) 流量分流验证 (规则匹配 + 权重随机 + canary route 替换)
        run: |
          mvn -B -ntp -pl lsc-gateway test \
            -Dtest='GrayReleaseGlobalFilterTest,GrayReleaseE2ETest' \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      - name: (c) 可观测性验证 (TraceId 透传 + Micrometer 指标 + Actuator 端点)
        run: |
          mvn -B -ntp -pl lsc-gateway test \
            -Dtest='ObservabilitySmokeTest,TraceIdHolderTest' \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      - name: Aggregate Gray + Observability summary
        if: always()
        run: |
          echo "### Gray Release & Observability Test Summary" >> $GITHUB_STEP_SUMMARY
          for d in lsc-gateway/target/surefire-reports lsc-common/target/surefire-reports; do
            [ -d "$d" ] || continue
            echo "#### $d" >> $GITHUB_STEP_SUMMARY
            find "$d" -name '*.txt' -maxdepth 1 | while read -r f; do
              head -6 "$f" | sed -n '2,6p' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            done
          done

      - name: Upload Gray + Observability surefire reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gray-observability-surefire
          path: |
            lsc-gateway/target/surefire-reports/**
            lsc-common/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: [build, frontend-unit-tests, contract-testing, integration-testing, gray-and-observability]
    if: always()
    steps:
      - name: Enforce quality gate
        run: |
          echo "Build result: ${{ needs.build.result }}"
          echo "Frontend unit tests result: ${{ needs.frontend-unit-tests.result }}"
          echo "Contract testing result: ${{ needs.contract-testing.result }}"
          echo "Integration testing result: ${{ needs.integration-testing.result }}"
          fail=0
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Build, tests, or coverage check failed. Quality gate NOT passed."
            fail=1
          fi
          if [ "${{ needs.frontend-unit-tests.result }}" != "success" ]; then
            echo "::error::Frontend unit tests failed. Quality gate NOT passed."
            fail=1
          fi
          if [ "${{ needs.contract-testing.result }}" != "success" ]; then
            echo "::error::Contract testing job failed. Quality gate NOT passed."
            fail=1
          fi
          if [ "${{ needs.integration-testing.result }}" != "success" ]; then
            echo "::error::Integration testing job failed. Quality gate NOT passed."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "::notice::Quality gate PASSED — all builds, tests, contract tests, integration tests, frontend unit tests, and coverage checks succeeded."

  frontend-unit-tests:
    name: Frontend tests (vitest + coverage + e2e + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: lsc-admin-web
            dir: lsc-admin-web
            node: 24
          - name: lsc-merchant-web
            dir: lsc-merchant-web
            node: 24
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js ${{ matrix.app.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.app.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.app.dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app.dir }}
        run: npm ci --no-audit --no-fund

      - name: Run Vitest unit tests with coverage
        working-directory: ${{ matrix.app.dir }}
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile.junit=junit-report.xml

      - name: Install Playwright browsers
        working-directory: ${{ matrix.app.dir }}
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E + axe-core a11y
        working-directory: ${{ matrix.app.dir }}
        run: npm run e2e

      - name: Upload Vitest JUnit reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vitest-junit-${{ matrix.app.name }}
          path: ${{ matrix.app.dir }}/junit-report.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vitest-coverage-${{ matrix.app.name }}
          path: ${{ matrix.app.dir }}/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright E2E reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-e2e-${{ matrix.app.name }}
          path: ${{ matrix.app.dir }}/e2e-junit.xml
          if-no-files-found: ignore
          retention-days: 7
