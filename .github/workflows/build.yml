name: Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 职责：仅负责编译与打包（拆分自原 build.yml）
# 测试→ test.yml | 静态分析→ lint.yml | 安全→ security-scan.yml | 部署→ deploy.yml

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & Package (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Compile all modules
        run: mvn -B -ntp -T 1C clean compile -DskipTests

      - name: Package without tests
        run: mvn -B -ntp -T 1C package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: '**/target/lsc-*.jar'
          if-no-files-found: warn
          retention-days: 14
