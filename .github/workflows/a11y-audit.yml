# ============================================================================
# 链盛通 LSC V6.2-AI · 质量四重门控 PR / Push CI 工作流
# ----------------------------------------------------------------------------
# 触发:
#   · 每个 push 到 master/main / release-*
#   · 每个 pull_request (目标任意分支)
#   · 手动 workflow_dispatch
#
# 门控 (3 job 并行 + 1 summary job, 任一失败 阻断合入):
#   Job 1) coverage-gate    · c8 覆盖率硬阈值: Stmt≥99% / Branch≥95% / Func≥95%
#   Job 2) assets-meta-gate · 资产体量 (单文件 ≤ 阈值) + 元数据审计 (SEO/OG/meta)
#   Job 3) a11y-gate       · 16 快照 light/dark axe-core 严格 0 违规 + baseline diff
# ============================================================================

name: LSC V6.2-Quality Gate (coverage · assets · meta · a11y 16 snap)

on:
  push:
    branches: [ master, main, "release-*" ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      maxViolations:
        description: '[A11y] 允许的 violations 阈值 (default 0)'
        required: false
        default: '0'
      maxConsoleE:
        description: '[A11y] 允许的 console.error 阈值 (default 0)'
        required: false
        default: '0'
      maxNet:
        description: '[A11y] 允许的 4xx/5xx 次数 (default 0)'
        required: false
        default: '0'
      skipDiff:
        description: '[A11y] 跳过 baseline diff (true / false, 默认 false, master 首次跑可开)'
        required: false
        default: 'false'
      minStmt:
        description: '[Coverage] 语句覆盖率下限 % (default 99)'
        required: false
        default: '99'
      minBranch:
        description: '[Coverage] 分支覆盖率下限 % (default 95)'
        required: false
        default: '95'
      minFunc:
        description: '[Coverage] 函数覆盖率下限 % (default 95)'
        required: false
        default: '95'

concurrency:
  group: lsc-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_VERSION: "20.x"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright-browsers


jobs:

  # =========================================================================
  #  JOB 1 : Coverage Gate — c8 覆盖率硬阈值门控
  # =========================================================================
  coverage-gate:
    name: Coverage Gate (Stmt≥${{ inputs.minStmt || 99 }}% / Branch≥${{ inputs.minBranch || 95 }}% / Func≥${{ inputs.minFunc || 95 }}%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: lsc-system/package-lock.json

      - name: npm ci (frozen lockfile)
        run: cd lsc-system && npm ci --no-audit --no-fund

      - name: Run c8 coverage (coverage_runner assertions + hard thresholds)
        id: cov
        run: |
          cd lsc-system
          export C8_CHECK_COVERAGE=true
          export C8_LINES=${{ inputs.minStmt || 99 }}
          export C8_STATEMENTS=${{ inputs.minStmt || 99 }}
          export C8_BRANCHES=${{ inputs.minBranch || 95 }}
          export C8_FUNCTIONS=${{ inputs.minFunc || 95 }}
          set -o pipefail
          mkdir -p coverage
          npm run coverage 2>&1 | tee coverage/coverage.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Upload Coverage artifacts (HTML + lcov + summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsc-coverage-${{ github.sha }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            lsc-system/coverage/

      - name: Write Coverage summary to Job Summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "# 链盛通 LSC V6.2-AI · 覆盖率门控"
            echo ""
            echo "**退出码**: ${{ steps.cov.outputs.exit_code }}"
            echo ""
            echo "| 指标 | 要求 |"
            echo "|---|---|"
            echo "| Statements | >= ${{ inputs.minStmt || 99 }}% |"
            echo "| Branches   | >= ${{ inputs.minBranch || 95 }}% |"
            echo "| Functions  | >= ${{ inputs.minFunc || 95 }}% |"
            echo ""
            if [ -f lsc-system/coverage/coverage.log ]; then
              echo "## c8 text-summary (last 40 lines)"
              echo ""
              echo '```'
              tail -n 40 lsc-system/coverage/coverage.log
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Re-throw result
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          EXIT="${{ steps.cov.outputs.exit_code }}"
          echo "coverage exit=$EXIT"
          [ -z "$EXIT" ] && exit 2
          [ "$EXIT" -ne 0 ] && exit "$EXIT"
          exit 0

  # =========================================================================
  #  JOB 2 : Assets + Meta Gate
  # =========================================================================
  assets-meta-gate:
    name: Assets & Meta Gate (size threshold + SEO/OG/schema compliance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: lsc-system/package-lock.json

      - name: npm ci (frozen lockfile)
        run: cd lsc-system && npm ci --no-audit --no-fund

      - name: "Run audits: assets (size) + meta (compliance)"
        id: audits
        run: |
          cd lsc-system
          set +e
          echo "==> [1/2] audit:assets:ci --strict"
          npm run audit:assets:ci
          RC1=$?
          echo ""
          echo "==> [2/2] audit:meta:ci --strict"
          npm run audit:meta:ci
          RC2=$?
          echo ""
          echo "assets_rc=$RC1  meta_rc=$RC2"
          echo "assets_rc=$RC1" >> $GITHUB_OUTPUT
          echo "meta_rc=$RC2"   >> $GITHUB_OUTPUT
          if [ "$RC1" -ne 0 ] || [ "$RC2" -ne 0 ]; then exit 2; fi
          exit 0

      - name: Upload audit report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsc-assets-meta-${{ github.sha }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            lsc-system/audit-report/assets-audit.*
            lsc-system/audit-report/meta-audit.*

      - name: Write Assets+Meta summary to Job Summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "# 链盛通 LSC V6.2-AI · 资产 / 元数据门控"
            echo ""
            echo "| Audit | Exit Code | Description |"
            echo "|---|---|---|"
            echo "| audit:assets (size) | ${{ steps.audits.outputs.assets_rc }} | Single/total size threshold + missing resource check |"
            echo "| audit:meta (compliance) | ${{ steps.audits.outputs.meta_rc }} | title/description/OG/Twitter/schema/alt/icon |"
            echo ""
            echo "---"
            if [ -f lsc-system/audit-report/assets-audit.md ]; then
              echo "## Assets Audit Summary"
              echo ""
              cat lsc-system/audit-report/assets-audit.md
            fi
            echo "---"
            if [ -f lsc-system/audit-report/meta-audit.md ]; then
              echo "## Meta Audit Summary"
              echo ""
              cat lsc-system/audit-report/meta-audit.md
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Re-throw result
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          A="${{ steps.audits.outputs.assets_rc }}"
          M="${{ steps.audits.outputs.meta_rc }}"
          echo "assets=$A meta=$M"
          [ -z "$A" ] || [ -z "$M" ] && exit 2
          [ "$A" -ne 0 ] || [ "$M" -ne 0 ] && exit 2
          exit 0

  # =========================================================================
  #  JOB 3 : A11y Gate
  # =========================================================================
  a11y-gate:
    name: A11y 16-snapshot (Playwright Chromium + axe-core · light/dark)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: lsc-system/package-lock.json

      - name: npm ci (frozen lockfile)
        run: cd lsc-system && npm ci --no-audit --no-fund

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('lsc-system/package-lock.json', 'lsc-system/package.json') }}
          restore-keys: |
            pw-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium (with deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: cd lsc-system && npm run audit:a11y:install
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}

      - name: Prepare baseline (from master/latest successful run artifact)
        if: ${{ github.event_name == 'pull_request' && inputs.skipDiff != 'true' }}
        id: baseline-artifact
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          name: lsc-a11y-baseline
          workflow: a11y-audit.yml
          workflow_conclusion: success
          branch: ${{ github.base_ref || (github.event.repository.default_branch) }}
          path: .a11y-baseline-artifact

      - name: Link baseline file path
        run: |
          cd lsc-system
          mkdir -p audit-report
          if [ -f ${{ github.workspace }}/.a11y-baseline-artifact/a11y-baseline.baseline.json ]; then
            cp -a ${{ github.workspace }}/.a11y-baseline-artifact/a11y-baseline.baseline.json audit-report/a11y-baseline.baseline.json
            echo "Applied baseline from master artifact"
          elif [ -f audit-report/a11y-baseline.baseline.json ]; then
            echo "Using built-in audit-report/a11y-baseline.baseline.json"
          else
            echo "No master artifact nor built-in baseline, skipping diff, using strict gate only"
            echo "LSC_SKIP_DIFF=1" >> $GITHUB_ENV
          fi

      - name: Run A11y 16-snapshot audit (strict + diff)
        id: audit-run
        continue-on-error: true
        run: |
          cd lsc-system
          LABEL="${GITHUB_SHA::7}"
          if [ -n "$GITHUB_HEAD_REF" ]; then LABEL="PR${{ github.event.pull_request.number }}-${LABEL}"; fi
          EXTRA_ARGS=""
          [ "${{ inputs.maxViolations }}" ] && EXTRA_ARGS="$EXTRA_ARGS --max-violations=${{ inputs.maxViolations }}"
          [ "${{ inputs.maxConsoleE }}" ]   && EXTRA_ARGS="$EXTRA_ARGS --max-consoleE=${{ inputs.maxConsoleE }}"
          [ "${{ inputs.maxNet }}" ]        && EXTRA_ARGS="$EXTRA_ARGS --max-net=${{ inputs.maxNet }}"

          set -x
          npm run audit:a11y -- --strict --label="$LABEL" $EXTRA_ARGS
          STATUS1=$?
          set +x
          echo "audit_status=$STATUS1" >> $GITHUB_OUTPUT

          if [ "${LSC_SKIP_DIFF:-0}" != "1" ] && [ "${{ inputs.skipDiff }}" != "true" ]; then
            set -x
            npm run audit:a11y:diff
            STATUS2=$?
            set +x
            echo "diff_status=$STATUS2" >> $GITHUB_OUTPUT
          else
            echo "diff_status=0 (skipped)" >> $GITHUB_OUTPUT
            STATUS2=0
          fi

          if [ $STATUS1 -ne 0 ] || [ $STATUS2 -ne 0 ]; then
            echo "FINAL_EXIT=2" >> $GITHUB_OUTPUT
            exit 2
          else
            echo "FINAL_EXIT=0" >> $GITHUB_OUTPUT
            exit 0
          fi
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          FORCE_COLOR: 3

      - name: Save master baseline artifact (master/main/tag only)
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v4
        with:
          name: lsc-a11y-baseline
          if-no-files-found: error
          retention-days: 90
          path: |
            lsc-system/audit-report/a11y-baseline.json
            lsc-system/audit-report/a11y-baseline.md
            lsc-system/audit-report/a11y-baseline.baseline.json

      - name: Upload A11y artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsc-a11y-report-${{ github.sha }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            lsc-system/audit-report/a11y-baseline.json
            lsc-system/audit-report/a11y-baseline.md
            lsc-system/audit-report/a11y-diff.json
            lsc-system/audit-report/a11y-diff.md
            lsc-system/audit-report/*.png

      - name: Write A11y summary to Job Summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "# 链盛通 LSC V6.2-AI · A11y Audit Result"
            echo ""
            echo "| Step | Exit Code | Description |"
            echo "|---|---|---|"
            echo "| audit-a11y (strict) | ${{ steps.audit-run.outputs.audit_status }} | 16 snapshot 0-violation assertion |"
            echo "| audit-diff (vs master baseline) | ${{ steps.audit-run.outputs.diff_status }} | New violation check |"
            echo ""
            if [ -f lsc-system/audit-report/a11y-diff.md ]; then
              echo "---"
              echo "## Baseline Diff (auto-generated)"
              echo ""
              cat lsc-system/audit-report/a11y-diff.md
            elif [ -f lsc-system/audit-report/a11y-baseline.md ]; then
              echo "---"
              echo "## Snapshot Audit Summary (no Diff)"
              echo ""
              cat lsc-system/audit-report/a11y-baseline.md
            else
              echo "No report file found, please check artifacts."
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Re-throw result
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          STATUS1="${{ steps.audit-run.outputs.audit_status }}"
          STATUS2="${{ steps.audit-run.outputs.diff_status }}"
          FINAL="${{ steps.audit-run.outputs.FINAL_EXIT }}"
          echo "audit=$STATUS1 diff=$STATUS2 final=$FINAL"
          if [ -z "$FINAL" ] || [ "$FINAL" != "0" ]; then exit ${FINAL:-2}; fi
          exit 0

  # =========================================================================
  #  SUMMARY JOB
  # =========================================================================
  quality-gate-summary:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [coverage-gate, assets-meta-gate, a11y-gate]
    if: always()
    steps:
      - name: Enforce quality gate
        working-directory: ${{ github.workspace }}
        run: |
          echo "coverage-gate:   ${{ needs.coverage-gate.result }}"
          echo "assets-meta-gate: ${{ needs.assets-meta-gate.result }}"
          echo "a11y-gate:        ${{ needs.a11y-gate.result }}"
          echo ""
          FAIL=0
          for r in "${{ needs.coverage-gate.result }}" "${{ needs.assets-meta-gate.result }}" "${{ needs.a11y-gate.result }}"; do
            case "$r" in
              success) ;;
              *) FAIL=1; echo "FAILED gate: $r" ;;
            esac
          done
          echo ""
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Quality gate FAILED — one or more gates did not pass."
            exit 1
          else
            echo "::notice::Quality gate PASSED — coverage / assets / meta / a11y all green."
          fi
