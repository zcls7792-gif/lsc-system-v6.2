name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 每周一 UTC 03:00 周期扫描
    - cron: '0 3 * * 1'

# 职责：依赖 CVE 扫描 + 代码静态安全分析
# 与方案安全目标对齐：依赖 CVE = 0
# 使用 GitHub 原生能力（dependency-review + CodeQL），无需项目内 Maven plugin 配置

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  codeql:
    name: CodeQL Static Analysis (Java)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Compile (CodeQL build mode: none)
        run: mvn -B -ntp -T 1C clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:java'

  security-gate:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [dependency-review, codeql]
    if: always()
    steps:
      - name: Enforce security gate
        env:
          DR: ${{ needs.dependency-review.result }}
          CQ: ${{ needs.codeql.result }}
        run: |
          echo "dependency-review=${DR}  codeql=${CQ}"
          # dependency-review 在非 PR 事件下为 skipped，视为通过
          if [ "${DR}" = "failure" ]; then
            echo "::error::Dependency review failed (新增依赖存在 moderate+ CVE 或受限许可证)"
            exit 1
          fi
          if [ "${CQ}" = "failure" ]; then
            echo "::error::CodeQL 分析失败，存在安全告警"
            exit 1
          fi
          echo "::notice::Security gate PASSED"
