name: Test & Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 职责：单元测试 + JaCoCo 覆盖率 + 质量门禁（从 build.yml 拆出）
# 与方案质量目标对齐：2551 测试 · 行覆盖率 96.61% · 指令 96.95% · 分支 89.14% · 类 100%

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & JaCoCo (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run unit tests with coverage
        run: mvn -B -ntp test

      - name: Generate JaCoCo coverage report
        run: mvn -B -ntp jacoco:report

      - name: Check coverage thresholds (Quality Gate)
        run: mvn -B -ntp jacoco:check

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: '**/target/jacoco/**'
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: '**/target/jacoco/jacoco.xml'
          if-no-files-found: ignore
          retention-days: 14

  quality-gate:
    name: Quality Gate Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Enforce quality gate
        run: |
          echo "Test result: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Unit tests or coverage check failed. Quality gate NOT passed."
            exit 1
          else
            echo "::notice::Quality gate PASSED — all tests and coverage checks succeeded."
          fi
