server:
  port: 8113
  servlet:
    context-path: /lsc-evidence

spring:
  application:
    name: lsc-evidence-service
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: LSC_GROUP
      config:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: LSC_GROUP
        file-extension: yaml
        shared-configs:
          - data-id: lsc-common-datasource.yaml
            group: LSC_GROUP
            refresh: true
          - data-id: lsc-common-infra.yaml
            group: LSC_GROUP
            refresh: true
          - data-id: lsc-common-redis.yaml
            group: LSC_GROUP
            refresh: true
  # ============ 数据源 (MySQL 8.0, 8库分库分表: lsc_evidence库, blockchain_records表按biz_id取模32) ============
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1:3306}/lsc_evidence?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai&&rewriteBatchedStatements=true
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
    username: ${MYSQL_USER}
    password: ${MYSQL_PWD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
  # ============ Redis 集群 (存证批次计数、补传锁) ============
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
      database: ${REDIS_DB:13}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.lianshengtong.evidence.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# Redisson
redisson:
  config: |
    singleServerConfig:
      address: "redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}"
      password: ${REDIS_PWD}
      database: ${REDIS_DB:13}
      connectionMinimumIdleSize: 8
      connectionPoolSize: 32
      idleConnectionTimeout: 10000
      connectTimeout: 5000
      timeout: 3000
      retryAttempts: 3
      retryInterval: 1500
    threads: 8
    nettyThreads: 16
    codec: !<org.redisson.codec.JsonJacksonCodec> {}

# 业务配置
lsc:
  evidence:
    # JWT 鉴权配置 (双令牌模型: Access 2小时 + Refresh 7天)
    jwt:
      secret: ${JWT_SECRET}
      # Access Token 过期时间: 2小时 (生产环境建议 30 分钟 ~ 2 小时)
      expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:7200000}
      # Refresh Token 过期时间: 7天 (生产环境建议 7 ~ 30 天)
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    # 登录安全配置
    max-login-attempts: ${AUTH_MAX_LOGIN_ATTEMPTS:5}
    lockout-duration-ms: ${AUTH_LOCKOUT_DURATION_MS:300000}
    # 存证触发: 每满 3000 条 或 每 1 小时
    batch-count: 3000
    batch-interval-cron: "0 0 * * * ?"
    # 重试次数
    max-retry: 3
    # 故障补传扫描 cron (每30分钟)
    failover-scan-cron: "0 */30 * * * ?"
    # 区块链节点 RPC
    chain:
      rpc-url: ${CHAIN_RPC_URL:http://127.0.0.1:8545}
      contract-address: ${CHAIN_CONTRACT:0x0000000000000000000000000000000000000000}
      private-key: ${CHAIN_PK:}

# 日志
logging:
  level:
    root: INFO
    com.lianshengtong.evidence: DEBUG
    com.lianshengtong.common: INFO
    com.baomidou.mybatisplus: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    export:
      prometheus:
        enabled: true

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: evidence
      paths-to-match: /api/**
      packages-to-scan: com.lianshengtong.evidence.controller
