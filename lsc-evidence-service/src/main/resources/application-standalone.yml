server:
  port: 8113
  servlet:
    context-path: /lsc-evidence

spring:
  application:
    name: lsc-evidence-service
  mvc:
    servlet:
      load-on-startup: 1
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitMessagingAutoConfiguration
      - org.springframework.cloud.autoconfigure.RefreshAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - com.alibaba.druid.spring.boot3.autoconfigure.DruidDataSourceAutoConfigure
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.export.simple.SimpleMetricsExportAutoConfiguration
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

# 允许在无数据库/Redis环境下启动 (用于本地演示/API冒烟)
# 关闭MyBatis-Plus自动配置
mybatis-plus:
  enabled: false

lsc:
  evidence:
    jwt:
      # 独立环境 Token 有效期可设长一些便于调试
      expiration-ms: 86400000
      refresh-expiration-ms: 604800000
    async:
      batch-size: 50
      flush-interval-ms: 100
      max-concurrent: 16

logging:
  level:
    root: INFO
    com.lianshengtong.evidence: INFO
    org.springframework: WARN
