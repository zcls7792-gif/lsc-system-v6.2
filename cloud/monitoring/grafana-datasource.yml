# ============================================================
# 链盛通LSC系统 - Grafana仪表板配置
# ============================================================

apiVersion: 1

providers:
  - name: 'LSC'
    orgId: 1
    folder: 'LSC系统监控'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'
      queryTimeout: '60s'

  - name: MySQL
    type: mysql
    url: mysql:3306
    database: lsc_system
    user: lsc_monitor
    password: ${GF_MYSQL_PASSWORD}
    editable: true

  - name: Redis
    type: redis
    url: redis://redis:6379
    editable: true
    jsonData:
      poolSize: 5
      timeoutInSeconds: 5