# ============================================================
# 链盛通LSC系统 - Prometheus监控配置
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: lsc-production
    region: cn-hangzhou
    env: production

# Alertmanager配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# 规则文件
rule_files:
  - /etc/prometheus/rules/*.yml

# 抓取配置
scrape_configs:
  # ---- Prometheus自身 ----
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # ---- API网关 ----
  - job_name: lsc-gateway
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - 127.0.0.1:8000

  # ---- 用户服务 ----
  - job_name: lsc-user-service
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - 127.0.0.1:8101

  # ---- 账本服务 ----
  - job_name: lsc-ledger-service
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - 127.0.0.1:8102

  # ---- 订单服务 ----
  - job_name: lsc-order-service
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - 127.0.0.1:8104

  # ---- 核销服务 ----
  - job_name: lsc-writeoff-service
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - 127.0.0.1:8105

  # ---- 营销服务 ----
  - job_name: lsc-promotion-service
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - 127.0.0.1:8107

  # ---- AI网关 ----
  - job_name: lsc-ai-gateway
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - 127.0.0.1:8201

  # ---- 存证服务 ----
  - job_name: lsc-evidence-service
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - 127.0.0.1:8113
        labels:
          service: evidence
          tier: blockchain

  # ---- 管理服务 ----
  - job_name: lsc-admin-service
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets:
          - 127.0.0.1:8200

  # ---- MySQL ----
  - job_name: mysql
    static_configs:
      - targets:
          - 127.0.0.1:9104
        labels:
          service: mysql
          tier: database

  # ---- Redis ----
  - job_name: redis
    static_configs:
      - targets:
          - 127.0.0.1:9121
        labels:
          service: redis
          tier: cache

  # ---- Nginx ----
  - job_name: nginx
    static_configs:
      - targets:
          - 127.0.0.1:9113
        labels:
          service: nginx
          tier: gateway

  # ---- Node Exporter ----
  - job_name: node
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          instance: ${HOSTNAME}
          role: app-server