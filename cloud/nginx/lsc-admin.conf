# ============================================================
# 链盛通LSC系统 - 管理后台前端配置
# admin.lianshengtong.com -> lsc-admin-web (Nginx静态站点)
# ============================================================

# ---- HTTP -> HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name admin.lianshengtong.com;
    return 301 https://$host$request_uri;
}

# ---- HTTPS 主配置 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.lianshengtong.com;

    # SSL证书
    ssl_certificate     /etc/nginx/ssl/admin.lianshengtong.com.pem;
    ssl_certificate_key /etc/nginx/ssl/admin.lianshengtong.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_ADMIN:10m;
    ssl_session_timeout 30m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self';" always;

    # ---- 静态文件根目录 ----
    root /usr/share/nginx/html/admin;
    index index.html;

    # ---- SPA路由支持(History模式) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API代理(管理后台调用后端) ----
    location /api/ {
        proxy_pass http://lsc_gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ---- 静态资源缓存 ----
    location ~* \.(chunk.js|css|woff2?|ttf|eot|ico|png|jpe?g|gif|svg|webp|avif|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
        access_log off;
    }

    # ---- Gzip压缩已在全局配置开启 ----
}