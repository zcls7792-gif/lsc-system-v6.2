# ============================================================
# 链盛通LSC系统 V6.2 - 生产级Nginx配置
# 统一入口: SSL终结 + 反向代理 + 负载均衡 + 静态资源
# ============================================================

# ---- 全局配置 ----
user nginx;
worker_processes auto;
worker_cpu_affinity auto;

error_log /var/log/nginx/lsc_error.log warn;
pid /run/nginx.pid;

worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    # ---- 基础优化 ----
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 300s;
    keepalive_requests 100000;
    reset_timedout_connection on;

    # ---- 缓冲区优化 ----
    client_body_buffer_size 256k;
    client_header_buffer_size 4k;
    client_max_body_size 200m;
    large_client_header_buffers 4 32k;

    # ---- 超时配置 ----
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # ---- Gzip压缩 ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/x-woff
        font/x-woff2
        .js
        .css
        .json
        .xml
        .txt
        .html;
    gzip_disable "MSIE [1-6]\.";

    # ---- 日志格式 ----
    log_format lsc_main '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        '$request_time $upstream_response_time '
                        'rt=$request_id trace=$http_x_b3_traceid';

    # ---- 虚拟主机配置 ----
    # Include API网关, 后台, 商户, 移动端
    include /etc/nginx/conf.d/lsc-api.conf;
    include /etc/nginx/conf.d/lsc-admin.conf;
    include /etc/nginx/conf.d/lsc-merchant.conf;
    include /etc/nginx/conf.d/lsc-mobile.conf;
}