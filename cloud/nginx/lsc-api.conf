# ============================================================
# 链盛通LSC系统 - API网关配置
# api.lianshengtong.com -> Spring Cloud Gateway (8000)
# ============================================================

upstream lsc_gateway_backend {
    least_conn;
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    # 多节点部署时添加更多后端
    # server 10.0.0.2:8000 max_fails=3 fail_timeout=30s;
    # server 10.0.0.3:8000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# ---- HTTP -> HTTPS 重定向 ----
server {
    listen 80;
    listen [::]:80;
    server_name api.lianshengtong.com;
    return 301 https://$host$request_uri;
}

# ---- HTTPS 主配置 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.lianshengtong.com;

    # SSL证书
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 30m;
    ssl_session_tickets off;

    # HSTS安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none';" always;

    # 请求ID注入
    add_header X-Request-ID $request_id always;

    # ---- 限流 ----
    limit_req_zone $binary_remote_addr zone=lsc_api:10m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=lsc_conn:10m;

    # ---- WebSocket/长连接支持 ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ---- 代理到API网关 ----
    location / {
        limit_req zone=lsc_api burst=500 nodelay;
        limit_conn lsc_conn 100;

        proxy_pass http://lsc_gateway_backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 超时配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 缓冲区
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        # 客户端真实IP
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # ---- 健康检查端点 ----
    location /actuator/health {
        proxy_pass http://lsc_gateway_backend;
        access_log off;
        proxy_set_header Host $host;
    }

    # ---- API文档(Knife4j) ----
    location /doc.html {
        proxy_pass http://lsc_gateway_backend;
        proxy_set_header Host $host;
    }

    # ---- 静态资源缓存 ----
    location ~* \.(ico|css|js|svg|woff|woff2|ttf|eot|png|jpg|jpeg|gif|webp|avif)$ {
        proxy_pass http://lsc_gateway_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}