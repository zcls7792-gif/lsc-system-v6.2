{{- /*
  创建专用 Secret（values.secret.create=true 时）。
*/ -}}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name | default "lsc-gateway-secrets" }}
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: lsc-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.stringData }}
  {{ $k }}: {{ tpl $v $ | quote }}
  {{- end }}
{{- end }}
