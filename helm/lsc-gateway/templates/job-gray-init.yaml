{{- if .Values.initNacosGray.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: lsc-gateway-gray-init-{{ .Release.Revision }}
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    app.kubernetes.io/name: lsc-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gray-init-job
  annotations:
    "helm.sh/hook": {{ .Values.initNacosGray.hook | default "post-install" }}
    "helm.sh/hook-weight": {{ .Values.initNacosGray.hookWeight | default "-5" | quote }}
    "helm.sh/hook-delete-policy": {{ .Values.initNacosGray.hookDeletePolicy | default "before-hook-creation" }}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lsc-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gray-init-job
    spec:
      serviceAccountName: {{ include "lsc-gateway.serviceAccountName" . | default (printf "lsc-gateway-%s" .Release.Name) }}
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: gray-init-cfg
          configMap:
            name: lsc-gateway-gray-init
            defaultMode: 0755
      containers:
        - name: init-nacos-gray
          image: "{{ .Values.initNacosGray.image.repository }}:{{ .Values.initNacosGray.image.tag }}"
          imagePullPolicy: {{ .Values.initNacosGray.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/push-gray-release.sh"]
          volumeMounts:
            - name: gray-init-cfg
              mountPath: /cfg
              readOnly: true
            - name: gray-init-cfg
              mountPath: /scripts/push-gray-release.sh
              subPath: push-gray-release.sh
          env:
            - name: NACOS_ADDR
              value: {{ default .Values.env.NACOS_ADDR .Values.initNacosGray.nacosAddr | quote }}
            - name: NACOS_NAMESPACE
              value: {{ .Values.initNacosGray.namespace | default .Values.env.NACOS_NAMESPACE | default "public" | quote }}
            - name: NACOS_GROUP
              value: {{ .Values.initNacosGray.group | default .Values.env.NACOS_GROUP | default "LSC_GROUP" | quote }}
            - name: GRAY_NACOS_DATA_ID
              value: {{ .Values.initNacosGray.dataId | default .Values.env.GRAY_NACOS_DATA_ID | default "gray-release.yaml" | quote }}
            - name: NACOS_TYPE
              value: {{ .Values.initNacosGray.type | default "yaml" | quote }}
            - name: NACOS_TENANT
              value: {{ .Values.initNacosGray.tenant | default .Values.env.NACOS_NAMESPACE | default "" | quote }}
            - name: IDEMPOTENCY
              value: {{ .Values.initNacosGray.idempotency | default "diff-only" | quote }}
            {{- if .Values.initNacosGray.auth.enabled }}
            - name: NACOS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.create | ternary .Values.secret.name .Values.secret.existingName }}
                  key: {{ .Values.initNacosGray.auth.usernameKey }}
                  optional: true
            - name: NACOS_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.create | ternary .Values.secret.name .Values.secret.existingName }}
                  key: {{ .Values.initNacosGray.auth.passwordSecretKey }}
                  optional: true
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
{{- end }}
