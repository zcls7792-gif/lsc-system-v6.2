spring:
  application:
    name: lsc-platform
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/lsc?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

# 微信小程序配置 — 敏感凭证从环境变量注入，缺失时为空字符串（开发期不阻断启动）
# 部署时通过 -Dwx.mp.app-id=xxx 或 WX_MP_APP_ID/WX_MP_APP_SECRET 环境变量注入
wx:
  mp:
    app-id: ${WX_MP_APP_ID:}
    app-secret: ${WX_MP_APP_SECRET:}
    token: ${WX_MP_TOKEN:}
    aes-key: ${WX_MP_AES_KEY:}
    # 微信 H5 网页授权回调域名（不含路径），需在微信公众平台「网页授权域名」中配置一致
    # 例：https://h5.lsc.example.com
    callback-domain: ${WX_MP_CALLBACK_DOMAIN:}
    # 小程序服务器域名（request 合法域名），需在微信公众平台「服务器域名」中配置
    # 仅用于文档/校验参考，实际请求由小程序前端发起
    server-domain: ${WX_MP_SERVER_DOMAIN:}

# CORS 跨域配置 — 生产环境填写 H5 域名，多个用逗号分隔
# 开发期由 Vite 代理处理，保持 * 即可
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.zcls.lsc: INFO

# 禁用系统指标（沙箱/容器环境 cgroup v2 与 JDK 17 ProcessorMetrics 不兼容）
management:
  metrics:
    binders:
      system:
        enabled: false
      jvm:
        enabled: true
